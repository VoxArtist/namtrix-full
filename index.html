// Training needs the parametric NAM trainer (PyTorch and the trainer itself).
// When it is missing the app installs its own copy in the background, so the
// rest of the session carries on while it downloads.
let trainerInfo = null;        // last /api/trainer answer; null until asked
let trainerTimer = null;

async function refreshTrainerInfo(){
  try{ trainerInfo = (await bridgeApi('/api/trainer')).trainer; }
  catch(e){ trainerInfo = null; }
  const running = trainerInfo && trainerInfo.install && trainerInfo.install.state === 'running';
  clearTimeout(trainerTimer);
  if(running) trainerTimer = setTimeout(refreshTrainerInfo, 2000);
  renderTrainerBadge();
  document.querySelectorAll('[data-trainer-box]').forEach(renderTrainerBox);
  if(trainerInfo && trainerInfo.found && document.getElementById('startTraining') && state.step === 4){
    const recorded = (state.trainMatrix || []).filter(r => isDone('train', r.run)).length;
    document.getElementById('startTraining').disabled = !recorded;
  }
  return trainerInfo;
}

function renderTrainerBadge(){
  const el = document.getElementById('trainerBadge');
  if(!el) return;
  const job = trainerInfo && trainerInfo.install;
  if(job && job.state === 'running'){
    el.hidden = false;
    el.className = 'badge pending';
    el.textContent = `Installing trainer · ${job.phase} of ${job.phases.length - 1}`;
  }else if(job && job.state === 'done' && Date.now() - (renderTrainerBadge.doneAt ||= Date.now()) < 15000){
    el.hidden = false;
    el.className = 'badge excellent';
    el.textContent = 'Trainer installed';
    setTimeout(renderTrainerBadge, 15500);
  }else{
    el.hidden = true;
  }
}

async function installTrainer(){
  try{
    trainerInfo = (await bridgeApi('/api/trainer/install', {})).trainer;
    toast('Installing the trainer in the background. Carry on meanwhile.', 'ok');
  }catch(e){ toast(e.message, 'err'); }
  refreshTrainerInfo();
}

// The trainer card: nothing to say when it is there on a setup step, a way to
// get it when it is not, and progress while it installs.
function renderTrainerBox(box){
  const where = box.dataset.trainerBox;          // "setup" or "train"
  const t = trainerInfo;
  const job = t && t.install;
  if(!t){
    box.innerHTML = where === 'train' ? `<div class="card"><h3 style="color:var(--warn);">Training unavailable</h3>
      <p>The NAMTRIX engine is not running. Open this page from the NAMTRIX Full app.</p></div>` : '';
    return;
  }
  if(job && job.state === 'running'){
    const pct = Math.round(100 * job.phase / (job.phases.length - 1));
    box.innerHTML = `<div class="card">
      <h3>Installing the trainer &mdash; ${escapeHtml(job.phaseLabel)} (${job.phase} of ${job.phases.length - 1})</h3>
      <div style="height:8px;border-radius:6px;box-shadow:var(--press);overflow:hidden;margin:10px 0 8px;">
        <div style="height:100%;width:${Math.max(4, pct)}%;background:var(--accent);transition:width .4s;"></div></div>
      <p class="hint" style="margin:0;">${fmtDuration(job.elapsed)} so far${
        job.downloads.length ? ` · ${escapeHtml(job.downloads[job.downloads.length-1])}` : ''}. This runs in the background:
        keep setting up and recording, just leave NAMTRIX open.</p>
      <div class="btn-row" style="margin-top:10px;"><button class="btn ghost" data-t="cancel">Cancel</button></div></div>`;
  }else if(t.found){
    box.innerHTML = where === 'train'
      ? `<div class="card"><div class="kv" style="border:none;padding:0;"><span>Trainer</span>
          <span style="word-break:break-all;">${t.source === 'installed' ? 'installed by NAMTRIX' : escapeHtml(t.path)}</span></div></div>`
      : (job && job.state === 'done'
          ? `<div class="note good" style="margin-bottom:16px;">The trainer is installed. Training is ready when your recordings are.</div>` : '');
  }else{
    const failed = job && job.state === 'failed';
    box.innerHTML = `<div class="card" style="border-color:rgba(232,132,44,.45);">
      <h3 style="color:var(--accent);">Training needs the NAM trainer</h3>
      <p>The model is trained by the parametric NAM trainer, which is not on this Mac yet. NAMTRIX can
        download and install it for you: a one-time download of about 1 GB (PyTorch and the trainer) into
        NAMTRIX's own folder. It installs in the background, so you can keep going with the matrix and the
        recordings meanwhile.</p>
      ${failed ? `<div class="note warn" style="white-space:pre-wrap;">The install did not finish: ${escapeHtml(job.error || '')}</div>` : ''}
      <div class="btn-row" style="margin-top:12px;">
        ${t.canInstall ? `<button class="btn primary" data-t="install">${failed ? 'Try again' : 'Download and install the trainer'}</button>` : ''}
        <button class="btn ghost" data-t="locate">I already have one &mdash; locate it</button>
      </div></div>`;
  }
  const on = (k, fn) => { const b = box.querySelector(`[data-t="${k}"]`); if(b) b.onclick = fn; };
  on('install', installTrainer);
  on('cancel', async ()=>{
    if(!(await askModal({title:'Cancel the install?', body:'What has downloaded so far is removed.', ok:'Cancel install', cancel:'Keep installing'}))) return;
    bridgeApi('/api/trainer/install/cancel', {}).catch(()=>{});
    setTimeout(refreshTrainerInfo, 800);
  });
  on('locate', async ()=>{
    try{
      const r = await bridgeApi('/api/trainer/locate', {});
      if(!r.cancelled) refreshTrainerInfo();
    }catch(e){ toast(e.message, 'err'); }
  });
}

/* ============================= STEP DEFINITIONS ============================= */
const STEPS = [
  {key:'overview', label:'Overview'},
  {key:'params', label:'Parameter Space'},
  {key:'matrix', label:'OED Matrix'},
  {key:'record', label:'Reamp & Record'},
  {key:'dataset', label:'Train'},
  {key:'validate', label:'Validate'},
  {key:'export', label:'Export'},
];

function stepComplete(i){
  if(i===0) return state.step > 0;
  if(i===1) return state.knobs.length >= 2 && state.knobs.every(k=>k.name.trim());
  if(i===2) return matrixValid();
  if(i===3) return matrixValid() && allRecorded();
  if(i===4) return matrixValid() && !!(state.training && state.training.chains && state.training.chains.length);
  if(i===5) return matrixValid() && !!state.validation;
  if(i===6) return matrixValid();
  return false;
}
function stepLocked(i){
  if(i<=1) return false;
  if(i===2) return !stepComplete(1);
  if(i===3) return !stepComplete(2);
  if(i===4) return !stepComplete(2);
  if(i===5) return !stepComplete(2);
  if(i===6) return !stepComplete(2);
  return false;
}

function goto(i){
  if(stepLocked(i)) return;
  state.step = i;
  persist();
  render();
}

/* ============================= RENDER: NAV ============================= */
function renderNav(){
  const nav = document.getElementById('stepnav');
  nav.innerHTML = '';
  STEPS.forEach((s,i)=>{
    const btn = document.createElement('button');
    btn.className = 'step-btn' + (i===state.step?' current':'') + (stepComplete(i)?' complete':'') + (stepLocked(i)?' locked':'');
    btn.innerHTML = `<span class="step-num">${i}</span><span>${s.label}</span>`;
    btn.onclick = ()=>goto(i);
    nav.appendChild(btn);
  });
  document.getElementById('headerStatus').textContent = `Step ${state.step+1} of ${STEPS.length} · ${STEPS[state.step].label}`;
  const dots = document.getElementById('headerDots');
  dots.innerHTML = STEPS.map((s,i)=>`<div class="header-dot ${i===state.step?'active':(stepComplete(i)?'done':'')}"></div>`).join('');
}

function footer(prevEnabled, nextEnabled, nextLabel){
  return `<div class="nav-footer">
    <button class="btn ghost" id="btnPrev" ${prevEnabled?'':'disabled'}>&larr; Back</button>
    <button class="btn primary" id="btnNext" ${nextEnabled?'':'disabled'}>${nextLabel||'Continue'} &rarr;</button>
  </div>`;
}
function wireFooter(onNext){
  const prev = document.getElementById('btnPrev');
  const next = document.getElementById('btnNext');
  if(prev) prev.onclick = ()=>goto(state.step-1);
  if(next) next.onclick = ()=>{ if(onNext && onNext()===false) return; goto(state.step+1); };
}

    const preset = {name, knobs: state.knobs.map(k=>({name:k.name.trim(), min:k.min, max:k.max, avoidZero: avoidsZero(k)}))};
    if(existing >= 0) userPresets[existing] = preset; else userPresets.push(preset);
    await storeUserPresets();
    render();
    toast(`Saved "${name}" to My presets.`, 'ok');
  };
  document.getElementById('addKnob').onclick = ()=>{
    if(!confirmStructureChange('Adding a control')) return;
    state.knobs.push({name:`Control ${state.knobs.length+1}`, min:0, max:10});
    persist(); renderKnobRows(); renderNav();
  };
  const resSel = document.getElementById('resolution');
  resSel.value = String(state.resolution);
  resSel.onchange = ()=>{ state.resolution = parseFloat(resSel.value); persist(); };
  document.getElementById('seed').oninput = e=>{ state.seed = parseInt(e.target.value||0,10); persist(); };

  wireFooter(()=>{
    if(!state.knobs.length || !state.knobs.every(k=>k.name.trim())){
      toast('Every control needs a name.', 'err'); return false;
    }
  });
}

// Controls set to skip 0 that the current run sheet still puts at 0.

  const rows = [...(state.trainMatrix || []), ...(state.holdoutMatrix || [])];
  return state.knobs.filter((k,d) => avoidsZero(k) && rows.some(r => r.values[d] === 0)).map(k => k.name);
}

// "Volume I (High Treb)" -> "VOL I"; keeps roman numerals so the two volumes
// stay distinguishable at a glance
function shortKnobName(name){
  const bare = String(name).replace(/\([^)]*\)/g, '').trim();
  const parts = bare.split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  const common = {volume:'VOL', presence:'PRES', middle:'MID', treble:'TREB', bass:'BASS',
                  master:'MAST', gain:'GAIN', drive:'DRIVE', tone:'TONE', level:'LVL',
                  distortion:'DIST', sustain:'SUS', filter:'FILT', output:'OUT', reverb:'VERB'};
  let out = common[parts[0].toLowerCase()] || parts[0].slice(0, 4).toUpperCase();
  const tail = parts.slice(1).find(w => /^[ivx]+$/i.test(w) || /^\d+$/.test(w));
  if(tail) out += ' ' + tail.toUpperCase();
  return out;
}

// Reamp signals. Both ship inside the app. The short pair is published by the
// parametric trainer's author as truncated cuts of NAM's standard v3 input, made
// for exactly this case: the same signal is replayed once per knob setting, so
// its length multiplies by the size of the run sheet.
const SIGNAL_PRESETS = {
  v3: {
    label: "Long — NAM standard input, 190 s per run",
    train: 190, val: 0, separateVal: false,
    hint: "The full standard signal. The best coverage, and the slowest session.",
  },
  short: {
    label: "Short — 38 s + 7 s validation per run",
    train: 38, val: 7, separateVal: true,
    hint: "Truncated cuts of the same standard signal: about a quarter of the time per run, "
        + "and models trained on them still come out well. Holdout runs record the 38 s part only.",
  },
};

function signalPreset(){
  return SIGNAL_PRESETS[state.signalPreset] || SIGNAL_PRESETS.v3;
}

// playback seconds per training run, both files counted when validation is separate
function secondsPerRun(){
  const p = signalPreset();
  return p.train + p.val;
}

// playback for a whole session: holdout runs play the training signal only
function sessionSeconds(trainRuns, holdoutRuns){
  const p = signalPreset();
  return trainRuns*(p.train + p.val) + holdoutRuns*p.train;
}

function takeSeconds(kind){
  return takeParts(kind).length > 1 ? secondsPerRun() : signalPreset().train;
}

function remainingSeconds(){
  return allTakes().filter(t => !isDone(t.kind, t.row.run))
    .reduce((s,t)=>s + takeSeconds(t.kind), 0);
}

function fmtDuration(seconds){
  const m = Math.round(seconds/60);
  if(m < 60) return `${m} min`;
  return `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`;
}

function takeLabel(id){
  const [kind, run] = String(id).split(':');
  return kind === 'holdout' ? `Holdout ${run}` : `Run ${run}`;
}

function paramsFor(row){
  const out = {};
  state.knobs.forEach((k,i)=>{ out[k.name] = row.values[i]; });
  return out;
}

/* ============================ STEP 3: RECORD ============================ */

// Chain names for a setup. Only used when the setup is changed, so a session
// named its own way keeps its names.
function chainNamesFor(setup){
  if(setup.kind === 'device') return ['direct'];
  const out = setup.direct ? ['direct'] : [];
  const n = Math.max(1, Math.min(4, setup.mics || 1));
  for(let i=1;i<=n;i++) out.push(n === 1 ? 'mic' : `mic${i}`);
  return out;
}

function applyChainSetup(setup){
  const old = state.chains;
  state.chainSetup = setup;
  state.chains = chainNamesFor(setup).map((name, i) => {
    const same = old.find(c => c.name === name);
    return same ? same : {name, delay: 0};
  });
  state.chains.forEach((c,i)=>{
    if(!state.capture.channels[c.name]) state.capture.channels[c.name] = i + 1;
  });
  if(state.validateChain >= state.chains.length) state.validateChain = 0;
}

// Every recorded file is named after its chain, so renaming or re-counting the
// chains after recording has started orphans what is already on disk.
function forgetTakes(){
  state.runDone = {}; state.holdoutDone = {}; state.takeDelays = {};
  state.knobFeatures = {}; state.knobReview = {state:'idle', flagged:[], queue:[], rounds:0};
  state.training = null; state.validation = null; state.esrResults = {};
}

function recordingBlockers(){
  const out = [];
  if(!bridge.available) out.push('The capture engine is not running &mdash; open this page from the NAMTRIX Full app.');
  if(state.capture.outputDevice == null) out.push('Choose the output (section 2).');
  if(state.capture.inputDevice == null) out.push('Choose the inputs (section 3).');
  if(!state.capture.outDir) out.push('Choose where the recordings are saved (section 6).');
  const names = state.chains.map(c => slug(c.name));
  if(names.some(n => !n)) out.push('Every chain needs a name.');
  if(new Set(names).size !== names.length) out.push('Two chains share a name, so their files would collide.');
  const inputs = state.chains.map(c => state.capture.channels[c.name] || 1);
  if(new Set(inputs).size !== inputs.length) out.push('Two chains are set to the same input (section 3).');
  return out;
}

function allowRecordingsFolder(){
  if(!state.capture.outDir) return;
  fetch('/api/allow-folder', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path: state.capture.outDir})}).catch(()=>{});
}

// Record one run: every chain at once, and for the short signal the separate
// validation cut straight after. Returns what came back, and anything that makes
// the take unusable.
async function recordTake(take, overwrite){
  const cap = state.capture, row = take.row, kind = take.kind;
  const again = isDone(kind, row.run) || (state.knobReview.queue || []).includes(take.id);
  const all = [];
  for(const part of takeParts(kind)){
    if(cancelRequested) throw new Error('Recording cancelled; nothing was saved.');
    const r = await bridgeApi('/api/capture', {
      signal: part === 'val' ? 'short_val' : (signalPreset().separateVal ? 'short_train' : 'v3'),
      outDir: cap.outDir,
      outputDevice: cap.outputDevice, inputDevice: cap.inputDevice,
      outputChannel: cap.outputChannel,
      overwrite: !!(overwrite || again),
      alsoCheck: part === 'main' && takeParts(kind).length > 1
        ? state.chains.map(c => fileNameFor(row, kind, c.name, 'val')) : [],
      chains: state.chains.map(c=>({
        name: c.name, channel: cap.channels[c.name] || 1,
        file: fileNameFor(row, kind, c.name, part === 'val' ? 'val' : undefined),
      })),
    });
    r.results.forEach(res => { res.part = part; all.push(res); });
  }
  for(const res of all){
    if(res.delay == null) continue;
    state.takeDelays[`${kind}:${row.run}:${res.chain}${res.part === 'val' ? ':val' : ''}`] = res.delay;
    const chain = state.chains.find(c => c.name === res.chain);
    if(chain && res.part === 'main'){ chain.delay = res.delay; chain.measured = true; }
  }
  const problems = [];
  for(const res of all){
    const which = `${escapeHtml(res.chain)}${res.part === 'val' ? ' (validation cut)' : ''}`;
    if(res.clipped) problems.push(`${which} clipped. Lower that input's gain and record the run again.`);
    else if((res.peak == null || res.peak < -60) && !row.silenceCheck)
      problems.push(`${which} came back silent. Check that input is patched.`);
  }
  delete state.knobFeatures[take.id];   // the old measurement belonged to the old take
  if(!problems.length) setDone(kind, row.run, true);
  persist();
  return {results: all, problems};
}

function resultSummary(take, res){
  const main = res.results.filter(r => r.part === 'main');
  return `<b>${takeLabel(take.id)} saved.</b> ` + main.map(r =>
    `${escapeHtml(r.chain)} ${r.peak != null ? r.peak.toFixed(1)+' dBFS' : 'silent'}${
      r.delay != null ? ` · latency ${r.delay}` : ''}`).join(' &nbsp;·&nbsp; ');
}

function closeDialModal(){
  const el = document.getElementById('dialModal');
  if(el){
    if(el._dialObserver) el._dialObserver.disconnect();
    el.remove();
  }
  document.removeEventListener('keydown', dialKeyHandler);
}

let recordingBusy = false;
let cancelRequested = false;

// Every file a take writes: each chain, and the separate validation cut.
function takeFiles(take){
  return state.chains.flatMap(c => takeParts(take.kind).map(part =>
    fileNameFor(take.row, take.kind, c.name, part === 'val' ? 'val' : undefined)));
}

// A cancelled run leaves nothing behind: no files, no tick, no measurements.
async function forgetTake(take){
  try{ await bridgeApi('/api/delete-takes', {outDir: state.capture.outDir, files: takeFiles(take)}); }
  catch(e){ toast(e.message, 'err'); }
  setDone(take.kind, take.row.run, false);
  const prefix = `${take.kind}:${take.row.run}:`;
  Object.keys(state.takeDelays).forEach(k => { if(k.startsWith(prefix)) delete state.takeDelays[k]; });
  delete state.knobFeatures[take.id];
  persist();
  updateRecordingProgress();
  renderNav();
}
function dialKeyHandler(e){
  if(e.key === 'Escape' && !recordingBusy) closeDialModal();
}

// Full screen, readable from across the room: dial these, then press Record.
function openRecordModal(take, lastSummary){
  closeDialModal();
  if(!take) return;
  const row = take.row;
  const queue = state.knobReview.queue || [];
  const inQueue = queue.includes(take.id);
  const heading = inQueue
    ? `Re-record ${queue.indexOf(take.id) + 1} of ${queue.length} · ${takeLabel(take.id)}`
    : take.kind === 'holdout'
      ? `Holdout run ${row.run} of ${(state.holdoutMatrix||[]).length} · verification`
      : `Run ${row.run} of ${(state.trainMatrix||[]).length}`;
  const line = state.knobs.map((k,i)=>
    `<span class="k">${escapeHtml(shortKnobName(k.name))}</span>${row.values[i]}`)
    .join('<span class="sep">|</span>');
  const files = state.chains.flatMap(c => takeParts(take.kind).map(part =>
    escapeHtml(fileNameFor(row, take.kind, c.name, part === 'val' ? 'val' : undefined)))).join('  ·  ');

  const el = document.createElement('div');
  el.className = 'dial-backdrop';
  el.id = 'dialModal';
  el.setAttribute('role','dialog');
  el.setAttribute('aria-modal','true');
  el.innerHTML = `
    <div class="dial-card">
      ${lastSummary ? `<div class="note good" id="recLast" style="margin:0 0 22px;text-align:left;">${lastSummary}</div>` : ''}
      <div class="dial-run">${heading} — dial these settings</div>
      <div class="dial-line" id="dialLine">${line}</div>
      <div class="dial-file">${files}</div>
      <div id="recProblem" style="text-align:left;"></div>
      <div class="dial-actions">
        <button class="btn primary" id="recGo" style="font-size:15px;padding:14px 28px;">&#9679; Record</button>
        <button class="btn" id="recCancel" hidden style="color:var(--danger);">&#10005; I made a mistake, cancel this run</button>
        <button class="btn ghost" id="dialSave" title="Download a progress file to resume later or on another Mac">&#11015; Save progress</button>
        <button class="btn ghost" id="dialClose">Close</button>
      </div>
      <p class="hint" id="recHint">Plays ${takeSeconds(take.kind)} s. Keep hands off the gain while it runs.</p>
    </div>`;
  document.body.appendChild(el);

  // One line, as large as will fit. Width can be unmeasurable at this moment -- a
  // hidden tab, or layout not settled yet -- and shrinking against a zero width
  // would floor the headline at 14px, which is the opposite of the point.
  const lineEl = document.getElementById('dialLine');
  function fitDialLine(){
    const available = lineEl.clientWidth || (lineEl.parentElement && lineEl.parentElement.clientWidth) || 0;
    let size = Math.max(24, Math.min(200, Math.round((window.innerWidth || 900) / 5)));
    lineEl.style.fontSize = size + 'px';
    if(!available) return false;      // keep the readable default until a real width exists
    while(size > 14 && lineEl.scrollWidth > lineEl.clientWidth){
      size -= 2;
      lineEl.style.fontSize = size + 'px';
    }
    return true;
  }
  fitDialLine();
  if(window.ResizeObserver){
    const ro = new ResizeObserver(()=>{ if(fitDialLine()) ro.disconnect(); });
    ro.observe(lineEl);
    el._dialObserver = ro;
  }

  document.getElementById('dialClose').onclick = ()=>{ if(!recordingBusy) closeDialModal(); };
  // Saving mid-take would miss the take in progress, so it waits for it.
  document.getElementById('dialSave').onclick = ()=>{ if(!recordingBusy) saveProgressToFile(); };
  document.getElementById('recGo').onclick = ()=>recordFlow(take);
  document.addEventListener('keydown', dialKeyHandler);
}

async function recordFlow(take, overwrite){
  const go = document.getElementById('recGo');
  const close = document.getElementById('dialClose');
  const problem = document.getElementById('recProblem');
  const hint = document.getElementById('recHint');
  if(!go) return;
  recordingBusy = true;
  cancelRequested = false;
  const card = go.closest('.dial-card');
  card.classList.add('recording');
  const cancelBtn = document.getElementById('recCancel');
  cancelBtn.hidden = false;
  cancelBtn.disabled = false;
  cancelBtn.innerHTML = '&#10005; I made a mistake, cancel this run';
  cancelBtn.onclick = ()=>{
    cancelRequested = true;
    cancelBtn.disabled = true;
    cancelBtn.textContent = 'Cancelling…';
    bridgeApi('/api/capture/cancel', {}).catch(()=>{});
  };
  const cancelled = async ()=>{
    clearInterval(tick);
    await forgetTake(take);
    recordingBusy = false;
    card.classList.remove('recording');
    cancelBtn.hidden = true;
    go.disabled = false; close.disabled = false; save.disabled = false;
    go.innerHTML = '&#9679; Record';
    await askModal({title:'Run deleted',
      body:`${takeLabel(take.id)} was cancelled and its recording deleted. Check the knobs, then try again.`,
      ok:'Try again'});
  };
  const save = document.getElementById('dialSave');
  go.disabled = true; close.disabled = true; save.disabled = true;
  problem.innerHTML = '';
  let left = takeSeconds(take.kind) + 3;
  go.innerHTML = `Recording&hellip; ${left} s`;
  const tick = setInterval(()=>{ left = Math.max(0, left-1); go.innerHTML = `Recording&hellip; ${left} s`; }, 1000);
  let res = null;
  try{
    res = await recordTake(take, overwrite);
  }catch(e){
    if(cancelRequested) return cancelled();
    clearInterval(tick);
    recordingBusy = false;
    card.classList.remove('recording');
    cancelBtn.hidden = true;
    go.disabled = false; close.disabled = false; save.disabled = false;
    go.innerHTML = '&#9679; Record';
    if(/already exists/.test(e.message)){
      const replace = await askModal({title:'A take with this name already exists',
        body:`${escapeHtml((e.message.match(/^(.+?) already exists/) || [,'A file'])[1])} is already in the
          recordings folder. Replace it with a new recording?`,
        ok:'Replace it', cancel:'Cancel'});
      if(replace) return recordFlow(take, true);
      return;
    }
    problem.innerHTML = `<div class="note warn">${escapeHtml(e.message)}</div>`;
    return;
  }
  // Cancelled just as the take landed: it is still a run the user disowned.
  if(cancelRequested) return cancelled();
  clearInterval(tick);
  recordingBusy = false;
  card.classList.remove('recording');
  cancelBtn.hidden = true;
  updateRecordingProgress();
  renderNav();
  save.disabled = false;
  if(res.problems.length){
    go.disabled = false; close.disabled = false;
    go.innerHTML = '&#9679; Record again';
    hint.textContent = '';
    problem.innerHTML = `<div class="note warn">${res.problems.join('<br>')}
      <div class="btn-row" style="margin-top:10px;"><button class="btn" id="recKeep">Keep this take anyway</button></div></div>`;
    document.getElementById('recKeep').onclick = ()=>{
      setDone(take.kind, take.row.run, true);
      persist(); updateRecordingProgress(); renderNav();
      advanceRecording(take, res);
    };
    return;
  }
  advanceRecording(take, res);
}

function advanceRecording(take, res){
  const next = nextPendingTake();
  if(next){ openRecordModal(next, resultSummary(take, res)); return; }
  closeDialModal();
  onAllRecorded();
}

// The last take is in. A re-record round goes straight back to the check it came
// from; a first pass asks.
async function onAllRecorded(){
  const rv = state.knobReview;
  renderNav();
  if(rv.state === 'rerecording'){
    rv.queue = []; rv.state = 'idle'; persist();
    toast('Re-recorded. Checking again.', 'ok');
    startRecordingCheck();
    return;
  }
  if(rv.state !== 'idle') return;
  const go = await askModal({
    title: 'Every run is recorded',
    body: `${allTakes().length} takes are in the recordings folder. Check them now for knob positions that
      do not match the run sheet? A mistake found now costs one more take; found after training, it costs
      the training.`,
    ok: 'Start the check', cancel: 'Not now'});
  if(go) startRecordingCheck();
  else renderReviewCard();
}

/* ----------------------- recording check (knobs) ----------------------- */
// Knobs as the check wants them: with the dial step, so it never suggests a
// setting nobody could dial.
function kcKnobs(){ return state.knobs.map(k => ({...k, step: state.resolution})); }

function recordingCheckRuns(){
  return allTakes().filter(t => state.knobFeatures[t.id])
    .map(t => ({run: t.id, values: t.row.values, f: state.knobFeatures[t.id]}));
}

// One chain's takes are compared: a miked cab and a load-box feed sound nothing
// alike, and mixing them would be comparing two amps.
async function measureAllTakes(onProgress){
  const chain = state.chains[0];
  const todo = allTakes().filter(t => isDone(t.kind, t.row.run) && !state.knobFeatures[t.id]);
  const failed = [];
  let i = 0;
  for(const t of todo){
    if(onProgress) onProgress(++i, todo.length);
    try{ state.knobFeatures[t.id] = await measureTakeFromBridge(takePath(t.kind, t.row, chain.name)); }
    catch(e){ failed.push(t.id); }
  }
  persist();
  return failed;
}

let checkRunning = false;
async function startRecordingCheck(){
  if(checkRunning) return;
  checkRunning = true;
  const rv = state.knobReview;
  rv.state = 'checking';
  renderReviewCard('Reading the takes back&hellip;');
  const card = document.getElementById('reviewCard');
  if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
  let failed = [];
  try{
    failed = await measureAllTakes((i,n)=>renderReviewCard(`Measuring take ${i} of ${n}&hellip;`));
    const result = kcAnalyse(recordingCheckRuns(), kcKnobs());
    rv.rounds = (rv.rounds || 0) + 1;
    rv.unreadable = failed;
    if(!result.ready){
      rv.state = 'unchecked'; rv.reason = result.reason; rv.flagged = [];
    }else{
      rv.flagged = result.findings.map(f => ({
        id: f.run, status: f.status, featureLabel: f.featureLabel, worstZ: f.worstZ,
        suggestion: f.suggestion, note: f.note || null,
      }));
      rv.limits = result.limits.map(l => ({knob: l.knob, units: l.units === Infinity ? null : l.units}));
      rv.analysed = result.analysed;
      rv.state = rv.flagged.length ? 'flagged' : 'clean';
    }
  }catch(e){
    rv.state = 'unchecked'; rv.reason = e.message || String(e); rv.flagged = [];
  }finally{
    checkRunning = false;
    persist();
    renderReviewCard();
    renderNav();
  }
}

function renderReviewCard(progress){
  const box = document.getElementById('reviewCard');
  if(!box) return;
  const rv = state.knobReview;
  const recorded = allRecorded();
  // What the check can and cannot see on this gear. Said whenever it is coarse:
  // a clean result from a check that cannot see a knob is not a verified knob.
  const limits = rv.limits || [];
  const limitHint = limits.some(l => l.units == null || l.units > 5)
    ? `<p class="hint">How far off each control has to be before this check can tell it from ordinary
        take-to-take variation: ${limits.map(l => `${escapeHtml(l.knob)} ${
          l.units == null ? 'not visible' : l.units.toFixed(1)}`).join(' · ')}. So a clean result means
        "no gross mistakes", not "every knob verified".</p>` : '';
  const unreadable = (rv.unreadable || []).length
    ? `<p class="hint">${rv.unreadable.length} take${rv.unreadable.length===1?'':'s'} could not be read back
        from the recordings folder and ${rv.unreadable.length===1?'was':'were'} left out.</p>` : '';
  let html = `<h3>8 · Check the recordings</h3>`;
  if(progress){
    html += `<p>${progress}</p>`;
  }else if(rv.state === 'rerecording'){
    const left = (rv.queue||[]).filter(id => { const t = takeById(id); return t && !isDone(t.kind, t.row.run); });
    html += `<p>Re-recording ${rv.queue.length} flagged run${rv.queue.length===1?'':'s'}: ${left.length} left.</p>
      <div class="btn-row"><button class="btn primary" id="rvContinue">Continue re-recording</button></div>`;
  }else if(rv.state === 'flagged'){
    const rows = rv.flagged.map(f => {
      const sug = f.suggestion
        ? `<strong>${escapeHtml(f.suggestion.knob)}</strong> sounds like <strong>${f.suggestion.value}</strong>, not ${f.suggestion.was}`
        : 'no single knob explains it';
      return `<tr><td>${takeLabel(f.id)}</td>
        <td>${escapeHtml(f.featureLabel)} ${Math.abs(f.worstZ).toFixed(1)}&sigma; ${f.worstZ > 0 ? 'high' : 'low'}</td>
        <td>${sug}${f.note ? `<div class="hint">${escapeHtml(f.note)}</div>` : ''}</td></tr>`;
    }).join('');
    html += `<div class="note warn">${rv.flagged.length} run${rv.flagged.length===1?'':'s'} do not sound like
        ${rv.flagged.length===1?'its':'their'} run-sheet settings. A suggestion is the closest single-knob
        explanation, not a verdict.</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Run</th><th>What disagrees</th><th>Closest explanation</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${unreadable}
      <div class="btn-row">
        <button class="btn primary" id="rvRerecord">Re-record ${rv.flagged.length===1?'this run':`these ${rv.flagged.length} runs`}</button>
        <button class="btn ghost" id="rvIgnore">Ignore</button>
      </div>`;
  }else if(rv.state === 'clean'){
    html += `<div class="note good">No knob mistakes found across ${rv.analysed} takes.</div>${limitHint}${unreadable}
      <div class="btn-row"><button class="btn ghost" id="rvCheck">Check again</button></div>`;
  }else if(rv.state === 'ignored'){
    html += `<p>Check ignored with ${rv.flagged.length} run${rv.flagged.length===1?'':'s'} flagged.</p>
      <div class="btn-row"><button class="btn ghost" id="rvCheck">Check again</button></div>`;
  }else if(rv.state === 'unchecked'){
    html += `<div class="note">${escapeHtml(rv.reason || 'The check could not run.')}</div>${unreadable}
      <div class="btn-row"><button class="btn ghost" id="rvCheck">Check again</button></div>`;
  }else if(recorded){
    html += `<p>Every run is recorded. Check the takes for knob positions that do not match the run sheet.</p>
      <div class="btn-row"><button class="btn primary" id="rvCheck">Start the check</button></div>`;
  }else{
    html += `<p class="hint" style="margin-top:0;">Once every run is recorded, the takes are checked against
      each other for knob positions that do not match the run sheet.</p>`;
  }
  box.innerHTML = html;
  const on = (id, fn) => { const b = document.getElementById(id); if(b) b.onclick = fn; };
  on('rvCheck', startRecordingCheck);
  on('rvIgnore', ()=>{ rv.state = 'ignored'; persist(); renderReviewCard(); renderNav(); });
  on('rvRerecord', ()=>{
    rv.queue = rv.flagged.map(f => f.id);
    rv.state = 'rerecording';
    rv.queue.forEach(id => { const t = takeById(id); if(t) setDone(t.kind, t.row.run, false); });
    persist(); updateRecordingProgress(); renderReviewCard(); renderNav();
    openRecordModal(nextPendingTake());
  });
  on('rvContinue', ()=>{
    const next = nextPendingTake();
    if(next) openRecordModal(next); else onAllRecorded();
  });
}

function updateRecordingProgress(){
  const total = allTakes().length, done = takesDone();
  const v = document.getElementById('progDone');
  if(v) v.textContent = `${done} / ${total}`;
  const r = document.getElementById('progLeft');
  if(r) r.textContent = fmtDuration(remainingSeconds());
  document.querySelectorAll('[data-status]').forEach(td=>{
    const t = takeById(td.dataset.status);
    const ok = t && isDone(t.kind, t.row.run);
    td.innerHTML = ok ? '<span style="color:var(--good)">&#10003;</span>' : '&mdash;';
    const btn = td.parentElement.querySelector('[data-rec]');
    if(btn) btn.textContent = ok ? 'Redo' : 'Record';
  });
  const next = nextPendingTake();
  document.querySelectorAll('tr.next-up').forEach(tr=>tr.classList.remove('next-up'));
  if(next){
    const td = document.querySelector(`[data-status="${next.id}"]`);
    if(td) td.parentElement.classList.add('next-up');
  }
  const start = document.getElementById('startRecording');
  if(start) start.textContent = next ? (done ? 'Continue recording' : 'Start recording') : 'Every run recorded';
}

    try{
      const r = await bridgeApi('/api/choose-folder', {prompt:'Choose where to save the recordings',
                                                      default: state.capture.outDir || undefined});
      if(r.cancelled) return;
      state.capture.outDir = r.path;
      persist();
      render();
    }catch(e){ toast(e.message, 'err'); }
  };

  /* ---- 7 · record ---- */
  function refreshBlockers(){
    const blockers = recordingBlockers();
    document.getElementById('recBlockers').innerHTML = blockers.length
      ? `<div class="note warn">Before recording:<br>${blockers.join('<br>')}</div>` : '';
    document.getElementById('startRecording').disabled = !!blockers.length || !nextPendingTake();
    panel.querySelectorAll('[data-rec]').forEach(b => b.disabled = !!blockers.length);
  }
  document.getElementById('startRecording').onclick = ()=>{
    const next = nextPendingTake();
    if(next) openRecordModal(next);
  };
  panel.querySelectorAll('[data-rec]').forEach(btn=>{
    btn.onclick = ()=>{ const t = takeById(btn.dataset.rec); if(t) openRecordModal(t); };
  });
  updateRecordingProgress();
  refreshBlockers();
  renderReviewCard();

  /* ---- 2-4 · devices, via the bridge ---- */
  (async ()=>{
    const b = await probeBridge();
    const host = document.getElementById('bridgeCards');
    if(!host) return;
    if(!b.available){
      host.innerHTML = `<div class="card" style="border-color:rgba(232,132,44,.45);">
        <h3 style="color:var(--warn);">Capture unavailable</h3>
        <p>${b.error ? escapeHtml(b.error) : 'The audio engine is not running. Open this page from the NAMTRIX Full app, not as a file.'}</p></div>`;
      refreshBlockers();
      return;
    }
    const cap = state.capture;
    const outs = b.devices.filter(d=>d.maxOutput > 0);
    const ins  = b.devices.filter(d=>d.maxInput > 0);
    host.innerHTML = `
      <div class="card">
        <h3>2 · Output &mdash; where the reamp signal goes</h3>
        <div class="grid-2" style="margin-top:10px;">
          <div class="field" style="margin-bottom:0;">
            <label for="capOutDevice">Output device</label>
            <select id="capOutDevice">${outs.map(d=>`<option value="${d.index}">${escapeHtml(d.name)} (${d.maxOutput} out)</option>`).join('')}</select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="capOutChannel">Output channel</label>
            <input type="number" id="capOutChannel" min="1" value="${cap.outputChannel || 1}">
          </div>
        </div>
        <p class="hint">Into a reamp box, then the ${escapeHtml(state.ampName)} input. A pedal can usually take
          the interface output directly.</p>
      </div>

      <div class="card">
        <h3>3 · Inputs &mdash; one per chain</h3>
        <div class="field" style="margin:10px 0 0;">
          <label for="capInDevice">Input device</label>
          <select id="capInDevice">${ins.map(d=>`<option value="${d.index}">${escapeHtml(d.name)} (${d.maxInput} in)</option>`).join('')}</select>
        </div>
        <div id="capChannels" style="margin-top:12px;"></div>
        <p class="hint">An amp head's speaker output goes through a load box before the interface, never
          straight in.</p>
      </div>

      <div class="card">
        <h3>4 · Test the route</h3>
        <p>Plays timing blips and the loudest moments of the reamp signal out of the chosen output. Each
          chain's input is checked for level, and its latency is measured and saved to the chain for training.</p>
        <p class="hint">Set the ${escapeHtml(state.ampName)} to the loudest setting on the run sheet first, so
          no run clips. Aim for peaks between &minus;18 and &minus;3 dBFS.</p>
        <div class="btn-row"><button class="btn primary" id="capTest">&#9654; Play test signal</button></div>
        <div id="capResult"></div>
      </div>`;

    const outSel = document.getElementById('capOutDevice');
    const inSel  = document.getElementById('capInDevice');
    if(cap.outputDevice != null && outs.some(d=>d.index === cap.outputDevice)) outSel.value = String(cap.outputDevice);
    if(cap.inputDevice  != null && ins.some(d=>d.index === cap.inputDevice))  inSel.value  = String(cap.inputDevice);
    cap.outputDevice = outs.length ? parseInt(outSel.value, 10) : null;
    cap.inputDevice  = ins.length ? parseInt(inSel.value, 10) : null;
    persist();

    function renderChannelPickers(){
      const dev = b.devices.find(d=>d.index === cap.inputDevice);
      const max = dev ? dev.maxInput : 2;
      document.getElementById('capChannels').innerHTML = state.chains.map((c,i)=>`
        <div class="knob-row" style="grid-template-columns:1fr 110px;">
          <div style="font-size:12.5px;color:var(--text-dim);align-self:center;">${escapeHtml(c.name)} &mdash; input</div>
          <input type="number" data-capch="${escapeAttr(c.name)}" min="1" max="${max}"
                 value="${cap.channels[c.name] || (i+1)}">
        </div>`).join('');
      document.querySelectorAll('[data-capch]').forEach(inp=>{
        cap.channels[inp.dataset.capch] = parseInt(inp.value,10) || 1;
        inp.oninput = ()=>{ cap.channels[inp.dataset.capch] = parseInt(inp.value,10) || 1; persist(); refreshBlockers(); };
      });
    }
    renderChannelPickers();
    outSel.onchange = ()=>{ cap.outputDevice = parseInt(outSel.value,10); persist(); };
    inSel.onchange  = ()=>{ cap.inputDevice  = parseInt(inSel.value,10); persist(); renderChannelPickers(); };
    document.getElementById('capOutChannel').oninput = e=>{ cap.outputChannel = parseInt(e.target.value,10)||1; persist(); };

    const resultBox = document.getElementById('capResult');
    function renderRouteTest(t){
      if(!t){ resultBox.innerHTML = ''; return; }
      const byCh = new Map(t.inputs.map(i=>[i.channel, i]));
      const mine = new Set(state.chains.map(c=>cap.channels[c.name] || 1));
      const rows = state.chains.map(c=>{
        const i = byCh.get(cap.channels[c.name] || 1);
        if(!i) return '';
        return `<tr><td>${escapeHtml(c.name)}</td><td>Input ${i.channel}</td>
          <td>${i.peak != null ? i.peak.toFixed(1)+' dBFS' : 'silent'}</td>
          <td>${i.delay != null ? `${i.delay} samples` : `<span class="hint">${escapeHtml(i.delayNote || '—')}</span>`}</td>
          <td>${advice(i.advice)}</td></tr>`;
      }).join('');
      const stray = t.inputs.filter(i => !mine.has(i.channel) && i.advice !== 'none').map(i=>i.channel);
      resultBox.innerHTML = `
        <div class="table-wrap" style="margin-top:14px;"><table>
          <thead><tr><th>Chain</th><th>Input</th><th>Peak</th><th>Latency</th><th>Gain</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        ${stray.length ? `<p class="hint">Signal also arrived on input${stray.length>1?'s':''} ${stray.join(', ')},
          which no chain uses. If a chain should be there, change its input above.</p>` : ''}
        ${t.dropped ? `<p class="hint" style="color:var(--warn);">The stream dropped samples during the test; run it again.</p>` : ''}`;
    }
    renderRouteTest(state.routeTest);

    document.getElementById('capTest').onclick = async ()=>{
      const btn = document.getElementById('capTest');
      btn.disabled = true; btn.textContent = 'Playing…';
      resultBox.innerHTML = '';
      try{
        const r = await bridgeApi('/api/test-route', {
          outputDevice: cap.outputDevice, inputDevice: cap.inputDevice,
          outputChannel: cap.outputChannel,
          signal: signalPreset().separateVal ? 'short_train' : 'v3',
          channels: state.chains.map(c=>cap.channels[c.name] || 1),
        });
        // the latency is the number training needs, so it goes straight onto the chain
        const byCh = new Map(r.inputs.map(i=>[i.channel, i]));
        state.chains.forEach(c=>{
          const i = byCh.get(cap.channels[c.name] || 1);
          if(i && i.delay != null){ c.delay = i.delay; c.measured = true; }
        });
        state.routeTest = {inputs: r.inputs, dropped: r.dropped, at: Date.now()};
        persist();
        renderRouteTest(state.routeTest);
        renderChainRows();
      }catch(e){
        resultBox.innerHTML = `<div class="note warn">${escapeHtml(e.message)}</div>`;
      }finally{
        btn.disabled = false; btn.innerHTML = '&#9654; Play test signal';
      }
    };
    refreshBlockers();
  })();

  wireFooter();
}

/* ============================ STEP 4: TRAIN ============================ */
function modelBaseName(){
  return (state.modelName || '').trim() || (state.ampName || '').trim() || 'model';
}

function chainsToTrain(){
  if(state.chains.length === 1 || state.trainChain === 'all') return state.chains;
  const one = state.chains.find(c => c.name === state.trainChain);
  return one ? [one] : state.chains;
}

function modelNameFor(chain){
  const base = modelBaseName().replace(/\.nam$/i, '');
  return state.chains.length > 1 ? `${base} ${chain.name}` : base;
}

function trainingRequest(){
  const rows = (state.trainMatrix || []).filter(r => isDone('train', r.run));
  return {
    gear: state.ampName,
    knobs: state.knobs.map(k=>({name:k.name, min:k.min, max:k.max})),
    epochs: state.epochs,
    preset: state.signalPreset,
    defaultDir: state.training && state.training.outDir || state.capture.outDir || undefined,
    chains: chainsToTrain().map(c=>({
      name: c.name,
      modelName: modelNameFor(c),
      runs: rows.map(r=>({
        y: takePath('train', r, c.name),
        yVal: takeParts('train').length > 1 ? takePath('train', r, c.name, 'val') : null,
        params: paramsFor(r),
        delay: takeDelay('train', r.run, c),
      })),
    })),
  };
}

let pollTimer = null;
function stopPolling(){ if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; } }

function adoptTraining(st){
  const trained = st.chains.filter(c => c.files && c.files.length);
  if(!trained.length) return;
  const key = trained.map(c=>c.runDir).join('|');
  const had = state.training && state.training.chains.map(c=>c.runDir).join('|');
  if(key === had) return;
  state.training = {outDir: st.outDir, chains: trained.map(c=>({
    name: c.name, modelName: c.modelName, runDir: c.runDir, files: c.files, bestEsr: c.bestEsr}))};
  state.validation = null;     // a new model has not been validated yet
  state.esrResults = {};
  persist();
  renderNav();
}

// Training is watched from every step, not just this one: it runs for hours,
// and the header is where anyone looks.
let trainState = null;         // last /api/train/status
let trainStateAt = 0;          // when it arrived, for the ticking clock
let trainWatchTimer = null;

function clock(seconds){
  seconds = Math.max(0, Math.round(seconds));
  const h = Math.floor(seconds/3600), m = Math.floor(seconds%3600/60), s = seconds%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function trainElapsed(){
  if(!trainState) return 0;
  return trainState.elapsed + (trainState.state === 'running' ? (Date.now() - trainStateAt)/1000 : 0);
}
function trainEta(){
  const st = trainState;
  if(!st || st.state !== 'running' || !(st.fraction > 0.002) || st.elapsed < 45) return null;
  return trainElapsed() / st.fraction * (1 - st.fraction);
}
function trainReason(st){
  return String(st.error || '').split('\n\nThe full log is')[0];
}

async function watchTraining(){
  clearTimeout(trainWatchTimer);
  let st = null;
  try{ st = (await bridgeApi('/api/train/status')).status; }catch(e){ return; }
  trainState = st;
  trainStateAt = Date.now();
  if(st){
    adoptTraining(st);
    if(st.state === 'running') trainWatchTimer = setTimeout(watchTraining, 2000);
  }
  renderTrainBadge();
  renderTrainStatus();
}

function renderTrainBadge(){
  const el = document.getElementById('trainBadge');
  const st = trainState;
  if(!el) return;
  if(!st){ el.hidden = true; return; }
  el.hidden = false;
  el.onclick = ()=>goto(4);
  if(st.state === 'running'){
    el.className = 'badge pending';
    el.innerHTML = `Training ${Math.floor(100*(st.fraction||0))}% · <span class="clock">${clock(trainElapsed())}</span>`;
  }else if(st.state === 'failed'){
    el.className = 'badge failing';
    el.textContent = 'Training failed';
  }else{
    el.className = 'badge excellent';
    el.textContent = st.state === 'stopped' ? 'Training stopped' : 'Training finished';
  }
}

// The clock and the time left move every second between answers.
setInterval(()=>{
  if(!trainState || trainState.state !== 'running') return;
  renderTrainBadge();
  const el = document.getElementById('trainClock');
  if(el) el.textContent = clock(trainElapsed());
  const eta = document.getElementById('trainEta');
  const left = trainEta();
  if(eta) eta.textContent = left == null ? 'working it out…' : clock(left);
}, 1000);

function renderTrainStatus(){
  const box = document.getElementById('trainStatus');
  const st = trainState;
  if(!box) return;
  if(!st){ box.innerHTML = ''; return; }
  const epochs = st.epochs;
  const running = st.state === 'running';
  const cur = st.chains[st.current];
  const preparing = running && cur && (cur.state === 'preparing' || cur.state === 'checking' || (cur.state === 'training' && !cur.steps && !cur.epoch));
  const pct = Math.floor(100*(st.fraction || 0));
  const chainLines = st.chains.map(c=>{
    const label = {
      waiting: 'waiting its turn',
      checking: 'checking the recordings…',
      preparing: 'loading the recordings…',
      training: c.steps ? `epoch ${Math.min(epochs, c.epoch + 1)} of ${epochs} · ${Math.round(100*c.step/c.steps)}% through it`
                        : `epoch ${Math.min(epochs, c.epoch + 1)} of ${epochs}`,
      done: 'done', stopped: 'stopped early', failed: 'failed', skipped: 'skipped',
    }[c.state] || c.state;
    return `<div class="kv"><span>${escapeHtml(c.modelName)}</span>
      <span>${label}${c.bestEsr != null ? ` · best ESR ${c.bestEsr.toFixed(4)}` : ''}</span></div>
      ${c.silentLeftOut ? `<p class="hint" style="margin:2px 0 6px;">${c.silentLeftOut} silent take${c.silentLeftOut===1?'':'s'}
        (a volume or gain at 0) trained on but left out of the progress score, where silence would swamp it.</p>` : ''}
      ${(c.files||[]).map(f=>`<div class="kv"><span>${escapeHtml(f.split('/').pop())}</span>
        <span><button class="btn ghost" data-reveal="${escapeAttr(f)}" style="padding:4px 10px;font-size:11px;">Show in Finder</button></span></div>`).join('')}`;
  }).join('');

  let head = '';
  if(running){
    head = `<h3>${preparing ? 'Getting ready to train&hellip;' : `Training &mdash; ${pct}%`}</h3>
      <div class="pbar ${preparing ? 'busy' : ''}"><div style="width:${Math.max(1, pct)}%;"></div></div>
      <div style="display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 4px;">
        <div><div class="hint" style="margin:0;">Elapsed</div><div class="clock" id="trainClock" style="font-size:22px;">${clock(trainElapsed())}</div></div>
        <div><div class="hint" style="margin:0;">Time left</div><div class="clock" id="trainEta" style="font-size:22px;">${
          trainEta() == null ? 'working it out…' : clock(trainEta())}</div></div>
      </div>
      <p class="hint">${preparing ? 'Loading and checking every recording before the first epoch. This can take a minute or two.'
        : 'Leave NAMTRIX open; the Mac is kept awake until it finishes. You can use the other steps meanwhile.'}</p>`;
  }else if(st.state === 'done'){
    head = `<h3 style="color:var(--good);">Training finished in ${clock(st.elapsed)}</h3>
      <p>Saved in ${escapeHtml(st.outDir)}. The <code>_parametric.nam</code> file has the moving knobs and needs the
      NAM Parametric Plugin; the other is a standard NAM model at the knobs' middle positions.</p>`;
  }else if(st.state === 'stopped'){
    const saved = st.chains.some(c => c.files && c.files.length);
    head = `<h3>Stopped early after ${clock(st.elapsed)}</h3><p>${saved
      ? `The best model so far was exported to ${escapeHtml(st.outDir)}.`
      : 'It stopped before the first epoch finished, so there was no model to save yet.'}</p>`;
  }else if(st.state === 'failed'){
    const log = (st.chains.find(c=>c.state === 'failed') || {}).log;
    head = `<h3 style="color:var(--danger);">Training failed after ${clock(st.elapsed)}</h3>
      <p style="white-space:pre-wrap;">${escapeHtml(trainReason(st))}</p>
      ${st.tail && st.tail.length ? `<details style="margin-top:8px;"><summary class="hint" style="cursor:pointer;">Last lines from the trainer</summary>
        <div class="code-block" style="white-space:pre-wrap;">${escapeHtml(st.tail.join('\n'))}</div></details>` : ''}
      ${log ? `<div class="btn-row"><button class="btn ghost" data-reveal="${escapeAttr(log)}">Show the log in Finder</button></div>` : ''}`;
  }
  box.innerHTML = `<div class="card" style="border-color:${running ? 'rgba(232,132,44,.45)' : 'transparent'};">${head}${chainLines}
    ${running ? `<div class="btn-row"><button class="btn ghost" id="stopTraining">Stop early</button></div>` : ''}
    ${st.state === 'done' || (st.state === 'stopped' && st.chains.some(c => c.files && c.files.length)) ? `<div class="btn-row"><button class="btn primary" id="goValidate">Check the model's quality &rarr;</button></div>` : ''}
  </div>`;
  box.querySelectorAll('[data-reveal]').forEach(b=>b.onclick = ()=>bridgeApi('/api/reveal', {path: b.dataset.reveal}).catch(e=>toast(e.message,'err')));
  const stop = document.getElementById('stopTraining');
  if(stop) stop.onclick = async ()=>{
    const go = await askModal({title:'Stop training early?', body:'The best model so far is still exported.',
                               ok:'Stop', cancel:'Keep training'});
    if(go){ bridgeApi('/api/train/stop', {}).catch(e=>toast(e.message,'err')); setTimeout(watchTraining, 1500); }
  };
  const gv = document.getElementById('goValidate');
  if(gv) gv.onclick = ()=>goto(5);
  const btn = document.getElementById('startTraining');
  if(btn && running) btn.disabled = true;
}

function renderDataset(){
  const panel = document.getElementById('panel');
  const recorded = (state.trainMatrix || []).filter(r => isDone('train', r.run)).length;
  if(!state.modelName) state.modelName = state.ampName || '';
  panel.innerHTML = `
    <div class="eyebrow">Step 4</div>
    <h2>Train the model</h2>
    <p class="panel-intro">The training set is built from this session's recordings: every take paired with
      its knob settings and its measured latency. When you start, a folder dialog asks where to save the
      model.</p>

    <div id="trainStatus"></div>

    <div data-trainer-box="train"><div class="card"><p class="hint" style="margin:0;">Looking for the trainer&hellip;</p></div></div>

    <div class="card">
      <div class="field" style="margin:0 0 14px;">
        <label for="modelName">Model file name</label>
        <input type="text" id="modelName" value="${escapeAttr(state.modelName)}" spellcheck="false" autocomplete="off">
        <p class="hint" id="modelFiles"></p>
      </div>

      ${state.chains.length > 1 ? `
      <div class="field" style="max-width:420px;margin:0 0 14px;">
        <label for="trainChain">Chains to train</label>
        <select id="trainChain">
          <option value="all">All ${state.chains.length}, one after another</option>
          ${state.chains.map(c=>`<option value="${escapeAttr(c.name)}">${escapeHtml(c.name)} only</option>`).join('')}
        </select>
      </div>` : ''}

      <div class="field" style="max-width:420px;margin:0 0 10px;">
        <label for="epochs">Epochs</label>
        <select id="epochs">
          <option value="50">50 — quick check, is this working at all</option>
          <option value="200">200 — standard</option>
          <option value="400">400 — long, for a final profile</option>
        </select>
        <p class="hint">Training time scales with this. Each parametric epoch passes over every recording.</p>
      </div>

      <div class="kv"><span>Trains on</span><span id="kvTrainsOn"></span></div>
      <div class="btn-row">
        <button class="btn primary" id="startTraining">Start training</button>
      </div>
    </div>

    ${footer(true, true)}
  `;

  const epochsSel = document.getElementById('epochs');
  epochsSel.value = String(state.epochs);
  const chainSel = document.getElementById('trainChain');
  if(chainSel) chainSel.value = state.chains.some(c=>c.name===state.trainChain) ? state.trainChain : 'all';

  function refreshSummary(){
    const chains = chainsToTrain();
    document.getElementById('modelFiles').innerHTML = chains.map(c=>{
      const n = escapeHtml(modelNameFor(c));
      return `<code>${n}_parametric.nam</code> and <code>${n}.nam</code>`;
    }).join('<br>');
    document.getElementById('kvTrainsOn').textContent =
      `${recorded} recorded run${recorded===1?'':'s'} × ${chains.length} chain${chains.length===1?'':'s'}, ${state.epochs} epochs`;
  }
  refreshSummary();

  document.getElementById('modelName').oninput = e=>{ state.modelName = e.target.value; persist(); refreshSummary(); };
  epochsSel.onchange = ()=>{ state.epochs = parseInt(epochsSel.value,10) || 400; persist(); refreshSummary(); };
  if(chainSel) chainSel.onchange = ()=>{ state.trainChain = chainSel.value; persist(); refreshSummary(); };

  document.getElementById('startTraining').disabled = true;
  refreshTrainerInfo().then(t => {
    const btn = document.getElementById('startTraining');
    if(btn) btn.disabled = !(t && t.found) || !recorded;
  });

  document.getElementById('startTraining').onclick = async ()=>{
    const names = state.knobs.map(k=>k.name.trim());
    if(new Set(names).size !== names.length){ toast('Two controls share a name; the model needs them distinct.', 'err'); return; }
    if(!recorded){ toast('Record the training runs first.', 'err'); return; }
    const btn = document.getElementById('startTraining');
    btn.disabled = true;
    try{
      const r = await bridgeApi('/api/train', trainingRequest());
      if(r.cancelled){ btn.disabled = false; return; }
      trainState = r.status; trainStateAt = Date.now();
      renderTrainStatus(); renderTrainBadge();
      document.getElementById('trainStatus').scrollIntoView({behavior:'smooth', block:'start'});
      setTimeout(watchTraining, 1500);
    }catch(e){
      btn.disabled = false;
      toast(e.message, 'err');
    }
  };

  renderTrainStatus();
  watchTraining();
  wireFooter();
}

/* ============================ STEP 5: VALIDATE ============================ */
const SCORE_BANDS = [
  {max:0.005, label:'Flawless', range:'&lt; 0.005', text:'Flawless — indistinguishable from the real thing', cls:'flawless'},
  {max:0.015, label:'Excellent', range:'0.005 – 0.015', text:'Excellent — identical in a mix, microscopic differences isolated', cls:'excellent'},
  {max:0.05, label:'Good', range:'0.015 – 0.05', text:'Good, but imperfect — core tone captured, dynamics/extremes differ', cls:'good'},
  {max:Infinity, label:'Failing', range:'&gt; 0.05', text:'Failing — noticeably different from the real thing', cls:'failing'},
];
function bandFor(score){ return SCORE_BANDS.find(b => score < b.max); }

function validationRequest(){
  const rows = (state.holdoutMatrix || []).filter(r => isDone('holdout', r.run));
  return {
    preset: state.signalPreset,
    chains: state.training.chains.map(tc=>{
      const chain = state.chains.find(c=>c.name === tc.name) || {name: tc.name, delay: 0};
      return {name: tc.name, runDir: tc.runDir, holdout: rows.map(r=>({
        run: r.run, y: takePath('holdout', r, tc.name), params: paramsFor(r),
        delay: takeDelay('holdout', r.run, chain), silenceCheck: !!r.silenceCheck,
      }))};
    }),
  };
}

function renderValidationResult(){
  const box = document.getElementById('valResult');
  if(!box) return;
  const v = state.validation;
  if(!v){ box.innerHTML = ''; return; }
  box.innerHTML = v.chains.map(c=>{
    const runs = Object.entries(c.runs || {});
    const silent = runs.filter(([,r]) => r.silent);
    const silentOk = silent.filter(([,r]) => r.levelMatch).length;
    const band = c.average != null ? bandFor(c.average) : null;
    return `<div class="card" style="margin-top:16px;">
      ${v.chains.length > 1 ? `<h3>${escapeHtml(c.name)}</h3>` : ''}
      ${band ? `
        <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 10px;">
          <div style="font-family:var(--font-mono);font-size:38px;font-weight:700;">${c.average.toFixed(4)}</div>
          <span class="badge ${band.cls}">${band.label}</span>
        </div>
        <p style="font-size:14px;color:var(--text);">${band.text}</p>`
      : `<p>Only silent holdout runs were available, so there is no ESR to report.</p>`}
      ${silent.length ? `<p class="hint">Silence check${silent.length>1?'s':''}: ${silentOk} of ${silent.length} passed
        (every control at minimum; scored on level, not in the average).</p>` : ''}
      <details style="margin-top:10px;"><summary class="hint" style="cursor:pointer;">Every holdout run</summary>
        ${runs.map(([run, r])=>`<div class="kv"><span>Holdout ${run}</span><span>${
          r.missing ? 'recording missing' : esrBadge(r)}</span></div>`).join('')}
      </details>
    </div>`;
  }).join('');
}

async function pollValidation(){
  stopPolling();
  let st = null;
  try{ st = (await bridgeApi('/api/validate/status')).status; }catch(e){ return; }
  if(state.step !== 5 || !st) return;
  const btn = document.getElementById('startValidation');
  const prog = document.getElementById('valProgress');
  if(st.state === 'running'){
    if(btn){ btn.disabled = true; btn.textContent = 'Validating…'; }
    if(prog) prog.textContent = st.progress ? `Scoring ${st.progress}` : 'Loading the model…';
    pollTimer = setTimeout(pollValidation, 1500);
    return;
  }
  const settle = ()=>{ if(btn){ btn.disabled = false; btn.textContent = state.validation ? 'Validate again' : 'Start validation'; } };
  settle();
  if(prog) prog.textContent = '';
  if(st.state === 'failed'){
    document.getElementById('valResult').innerHTML = `<div class="note warn" style="white-space:pre-wrap;">${escapeHtml(st.error||'Validation failed.')}</div>`;
    return;
  }
  if(st.state === 'done' && st.result && st.result !== pollValidation._adopted){
    pollValidation._adopted = st.result;
    const mine = state.training && st.result.chains.every(c => state.training.chains.some(t => t.runDir === c.runDir));
    if(mine){
      state.validation = st.result;
      state.esrResults = {};
      Object.entries(st.result.chains[0].runs || {}).forEach(([run, r])=>{ if(!r.missing) state.esrResults[run] = r; });
      persist();
      renderNav();
    }
    renderValidationResult();
    settle();
  }
}

function renderValidate(){
  const panel = document.getElementById('panel');
  const trained = !!(state.training && state.training.chains.length);
  const holdouts = (state.holdoutMatrix || []).filter(r => isDone('holdout', r.run)).length;
  panel.innerHTML = `
    <div class="eyebrow">Step 5</div>
    <h2>Check your profile's quality</h2>
    <p class="panel-intro">Score can be:</p>

    <div class="table-wrap" style="max-height:none;">
      <table>
        <thead><tr><th>Score</th><th>Real-world translation</th></tr></thead>
        <tbody>${SCORE_BANDS.map(b=>`<tr><td>${b.range}</td><td>${b.text}</td></tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="startValidation" ${trained && holdouts ? '' : 'disabled'}>${state.validation ? 'Validate again' : 'Start validation'}</button>
      <span class="hint" id="valProgress" style="align-self:center;margin:0;">${
        !trained ? 'Train a model on the previous step first.'
        : !holdouts ? 'No holdout runs were recorded, so there is nothing to validate against.' : ''}</span>
    </div>

    <div id="valResult"></div>

    ${footer(true, true)}
  `;
  document.getElementById('startValidation').onclick = async ()=>{
    const btn = document.getElementById('startValidation');
    btn.disabled = true; btn.textContent = 'Validating…';
    document.getElementById('valResult').innerHTML = '';
    try{
      await bridgeApi('/api/validate', validationRequest());
      pollTimer = setTimeout(pollValidation, 1000);
    }catch(e){
      btn.disabled = false; btn.textContent = 'Start validation';
      document.getElementById('valResult').innerHTML = `<div class="note warn">${escapeHtml(e.message)}</div>`;
    }
  };
  renderValidationResult();
  if(trained) pollValidation();
  wireFooter();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

const RENDERERS = [renderOverview, renderParams, renderMatrix, renderRecord, renderDataset, renderValidate, renderExport];

function render(){
  stopPolling();
  closeDialModal();
  while(state.step > 0 && stepLocked(state.step)) state.step--;
  renderNav();
  RENDERERS[state.step]();
  window.scrollTo({top:0, behavior:'instant'});
}

function systemPrefersDark(){
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function currentTheme(){
  return state.theme || (systemPrefersDark() ? 'dark' : 'light');
}
function applyTheme(){
  const root = document.documentElement;
  if(state.theme) root.setAttribute('data-theme', state.theme);
  else root.removeAttribute('data-theme');
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = currentTheme() === 'dark' ? '☀ Light' : '☾ Dark';
}
applyTheme();
document.getElementById('themeToggle').onclick = ()=>{
  state.theme = currentTheme() === 'dark' ? 'light' : 'dark';
  persist();
  applyTheme();
};
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(!state.theme) applyTheme();     // only while following the system
  });
}

document.getElementById('saveProgressBtn').onclick = saveProgressToFile;
document.getElementById('loadProgressInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(file) loadProgressFromFile(file);
  e.target.value = '';
};

render();
allowRecordingsFolder();
refreshTrainerInfo();       // an install already running shows in the header
watchTraining();            // so does a training
loadUserPresets().then(()=>{ if(state.step === 1) render(); });

})();
</script>
