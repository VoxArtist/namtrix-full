<style>
  :root{
    /* Neumorphic ground: one surface colour, depth carried entirely by paired shadows */
    --bg:#e0e5ec;
    --surface:#e0e5ec;
    --surface-2:#dbe1e9;
    --surface-3:#d4dbe5;
    --sh-dark:#a3b1c6;
    --sh-light:#ffffff;
    --raise:7px 7px 14px var(--sh-dark), -7px -7px 14px var(--sh-light);
    --raise-sm:4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
    --press:inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
    --press-deep:inset 6px 6px 12px var(--sh-dark), inset -6px -6px 12px var(--sh-light);
    --border:#c8d1de;
    --border-soft:#d5dce6;
    --text:#33415c;
    --text-dim:#5c6b85;
    --text-faint:#8b97ab;
    --accent:#d73027;
    --accent-dim:#a50026;
    --accent-glow:rgba(215,48,39,.12);
    --good:#157a41;
    --good-glow:rgba(26,152,80,.14);
    --warn:#96650a;
    --warn-glow:rgba(224,176,62,.20);
    --danger:#a50026;
    --danger-glow:rgba(165,0,38,.10);
    --scale-0:#a50026;
    --scale-1:#d73027;
    --scale-2:#f46d43;
    --scale-3:#fdae61;
    --scale-4:#fee08b;
    --scale-5:#ffffbf;
    --scale-6:#d9ef8b;
    --scale-7:#a6d96a;
    --scale-8:#66bd63;
    --scale-9:#1a9850;
    --scale-10:#006837;
    --row-hover:rgba(255,255,255,.45);
    --code-text:#42506b;
    --slider-well-d:rgba(120,135,160,.55);
    --slider-well-l:rgba(255,255,255,.55);
    --font-mono:'Manrope',system-ui,-apple-system,sans-serif;
    --font-sans:'Manrope',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  }

  /* Dark neumorphism: the "light" shadow is a lifted tint, not white, or the
     raised/pressed illusion collapses on a dark ground. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#2b303b;
      --surface:#2b303b;
      --surface-2:#262a34;
      --surface-3:#21252e;
      --sh-dark:#1e222a;
      --sh-light:#373e4c;
      --border:#3a4150;
      --border-soft:#333a47;
      --text:#dfe4ec;
      --text-dim:#a8b1c1;
      --text-faint:#7d8799;
      --accent:#f4795a;
      --accent-dim:#d73027;
      --accent-glow:rgba(244,121,90,.16);
      --good:#66bd63;
      --good-glow:rgba(102,189,99,.16);
      --warn:#fdae61;
      --warn-glow:rgba(253,174,97,.16);
      --danger:#e56a5c;
      --danger-glow:rgba(229,106,92,.16);
      --row-hover:rgba(255,255,255,.04);
      --code-text:#c2cad8;
      --slider-well-d:rgba(0,0,0,.45);
      --slider-well-l:rgba(255,255,255,.10);
    }
  }
  :root[data-theme="dark"]{
    --bg:#2b303b;
    --surface:#2b303b;
    --surface-2:#262a34;
    --surface-3:#21252e;
    --sh-dark:#1e222a;
    --sh-light:#373e4c;
    --border:#3a4150;
    --border-soft:#333a47;
    --text:#dfe4ec;
    --text-dim:#a8b1c1;
    --text-faint:#7d8799;
    --accent:#f4795a;
    --accent-dim:#d73027;
    --accent-glow:rgba(244,121,90,.16);
    --good:#66bd63;
    --good-glow:rgba(102,189,99,.16);
    --warn:#fdae61;
    --warn-glow:rgba(253,174,97,.16);
    --danger:#e56a5c;
    --danger-glow:rgba(229,106,92,.16);
    --row-hover:rgba(255,255,255,.04);
    --code-text:#c2cad8;
    --slider-well-d:rgba(0,0,0,.45);
    --slider-well-l:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}   /* .badge, .card etc. set display, which would beat it */
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    padding-inline:16px;
    min-height:100%;
  }
  h1,h2,h3{font-family:var(--font-mono);font-weight:600;letter-spacing:-.01em;margin:0;}
  code, .mono{font-family:var(--font-mono);}
  code, .code-block, td, th, .kv span:last-child, input, select{font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button{font-family:var(--font-sans);cursor:pointer;}
  input,select{font-family:var(--font-mono);}
  ::selection{background:var(--accent-glow);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .shell{max-width:1180px;margin:0 auto;padding-block:24px 60px;}

  /* ---- Header ---- */
  .app-header{
    display:flex;align-items:center;gap:16px;justify-content:space-between;
    padding:18px 22px;background:var(--surface);border-radius:20px;
    box-shadow:var(--raise);margin-bottom:22px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:44px;height:44px;border-radius:14px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--raise-sm);
    overflow:hidden;
  }
  .brand-mark img{width:78%;height:78%;object-fit:contain;border-radius:50%;}
  .brand-text h1{font-size:18px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:9px;}
  .app-version{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--text-faint);letter-spacing:0;}
  .brand-wordmark{display:inline-block;height:19px;line-height:0;}
  .brand-wordmark img.wm{height:19px;width:auto;display:none;}
  .brand-wordmark img.wm-dark{display:block;}  /* default: light theme, navy wordmark */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .brand-wordmark img.wm-dark{display:none;}
    :root:not([data-theme="light"]) .brand-wordmark img.wm-light{display:block;}
  }
  :root[data-theme="dark"] .brand-wordmark img.wm-dark{display:none;}
  :root[data-theme="dark"] .brand-wordmark img.wm-light{display:block;}
  .brand-text p{margin:3px 0 0;font-size:12px;color:var(--text-dim);}
  .header-meter{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-dim);flex-wrap:wrap;}
  .header-dots{display:flex;gap:5px;}
  .header-dot{width:8px;height:8px;border-radius:50%;background:var(--surface);box-shadow:var(--press);}
  .header-dot.done{background:var(--good);box-shadow:none;}
  .header-dot.active{background:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}

  /* ---- Layout ---- */
  .layout{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start;}
  /* a grid item's min-width is its content's by default, so one wide run-sheet
     table would push the whole panel off the right edge */
  .layout > *{min-width:0;}
  @media (max-width:760px){ .layout{grid-template-columns:1fr;} }

  .stepnav{
    background:var(--surface);border-radius:20px;box-shadow:var(--raise);
    padding:12px;position:sticky;top:12px;display:flex;flex-direction:column;gap:4px;
  }
  @media (max-width:760px){
    .stepnav{position:static;flex-direction:row;overflow-x:auto;gap:8px;}
  }
  .step-btn{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
    border:none;background:var(--surface);color:var(--text-dim);
    text-align:left;font-size:12.5px;white-space:nowrap;
    transition:box-shadow .16s, color .16s;
  }
  .step-btn:hover:not(.locked):not(.current){box-shadow:var(--raise-sm);color:var(--text);}
  .step-btn.current{box-shadow:var(--press);color:var(--text);font-weight:600;}
  .step-btn.locked{opacity:.45;cursor:not-allowed;}
  .step-num{
    width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:10px;background:var(--surface);color:var(--text-faint);
    box-shadow:var(--raise-sm);
  }
  .step-btn.current .step-num{color:var(--accent);box-shadow:var(--press);}
  .step-btn.complete .step-num{color:var(--good);}
  .step-btn.complete .step-num::before{content:'✓';}

  .panel{
    background:var(--surface);border-radius:22px;box-shadow:var(--raise);
    padding:30px 32px;min-height:420px;
  }
  @media (max-width:600px){ .panel{padding:20px 18px;} }

  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .panel h2{font-size:22px;margin-bottom:8px;text-wrap:balance;}
  .panel-intro{color:var(--text-dim);font-size:13.5px;line-height:1.65;max-width:64ch;margin-bottom:24px;}

  /* ---- Raised panels ---- */
  .card{background:var(--surface);border-radius:18px;box-shadow:var(--raise-sm);padding:18px 20px;margin-bottom:16px;border:1px solid transparent;}
  .card h3{font-size:13px;margin-bottom:8px;}
  .card p{font-size:13px;color:var(--text-dim);line-height:1.65;margin:0;}
  .card + .card{margin-top:14px;}
  details.card > summary{list-style:none;}
  details.card > summary::-webkit-details-marker{display:none;}
  details.card > summary::before{content:'▸ ';color:var(--accent);}
  details.card[open] > summary::before{content:'▾ ';}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:600px){ .grid-2{grid-template-columns:1fr;} }

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0;}
  .stat{
    flex:1 1 150px;background:var(--surface);border-radius:16px;box-shadow:var(--raise-sm);
    padding:16px 18px;
  }
  .stat .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-bottom:7px;}
  .stat .value{font-family:var(--font-mono);font-size:23px;font-variant-numeric:tabular-nums;color:var(--text);}
  .stat .value.accent{color:var(--accent);}
  .stat .value.good{color:var(--good);}
  .stat .sub{font-size:11px;color:var(--text-dim);margin-top:4px;}

  .formula{
    background:var(--surface);border-radius:16px;box-shadow:var(--press);
    padding:18px 20px;font-family:var(--font-mono);font-size:14px;text-align:center;color:var(--text);
    margin:16px 0;overflow-x:auto;
  }

  /* ---- Tables sit in a pressed well ---- */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.07em;color:var(--text-faint);padding:10px 12px;
    position:sticky;top:0;background:var(--surface-2);
  }
  td{padding:8px 12px;border-bottom:1px solid var(--border-soft);font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);}
  tr:hover td{background:var(--row-hover);}
  .table-wrap{border-radius:16px;box-shadow:var(--press);background:var(--surface-2);overflow:auto;max-height:420px;margin:18px 0;padding:4px;}
  .tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:10px;font-family:var(--font-mono);letter-spacing:.03em;}
  .tag.edge{background:var(--warn-glow);color:var(--warn);}
  .tag.train{background:var(--surface-3);color:var(--text-faint);}

  /* ---- Inputs are pressed into the surface ---- */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:7px;}
  .field input[type=text], .field input[type=number], .field select{
    width:100%;background:var(--surface);border:none;color:var(--text);
    border-radius:12px;padding:11px 13px;font-size:13px;outline:none;box-shadow:var(--press);
  }
  .field input:focus, .field select:focus{box-shadow:var(--press-deep);}
  .knob-row{display:grid;grid-template-columns:1fr 70px 70px 34px;gap:10px;align-items:center;margin-bottom:10px;}
  .knob-row input{background:var(--surface);border:none;color:var(--text);border-radius:12px;padding:10px 11px;font-size:12.5px;width:100%;outline:none;box-shadow:var(--press);}
  .knob-row input:focus{box-shadow:var(--press-deep);}
  .icon-btn{
    background:var(--surface);border:none;color:var(--text-faint);border-radius:12px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;
    box-shadow:var(--raise-sm);
  }
  .icon-btn:hover{color:var(--danger);}
  .icon-btn:active{box-shadow:var(--press);}

  /* ---- Buttons: raised, and pressed while active ---- */
  .btn{
    font-family:var(--font-mono);font-size:12.5px;font-weight:500;padding:12px 20px;border-radius:14px;
    border:none;background:var(--surface);color:var(--text-dim);
    display:inline-flex;align-items:center;gap:8px;box-shadow:var(--raise-sm);
    transition:box-shadow .14s, color .14s;
  }
  .btn:hover{color:var(--text);}
  .btn:active{box-shadow:var(--press);}
  .btn.primary{color:var(--accent);font-weight:700;}
  .btn.good{color:var(--good);font-weight:700;}
  .btn.ghost{box-shadow:none;}
  .btn.ghost:hover{box-shadow:var(--raise-sm);}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:var(--press);color:var(--text-faint);}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}

  .nav-footer{display:flex;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid var(--border-soft);}

  .checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .checklist li{
    display:flex;align-items:flex-start;gap:12px;background:var(--surface);
    border-radius:14px;padding:12px 14px;font-size:13px;color:var(--text-dim);cursor:pointer;
    box-shadow:var(--raise-sm);
  }
  .checklist li.checked{box-shadow:var(--press);color:var(--text);}
  .checklist input{margin-top:2px;accent-color:var(--good);}

  .badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;padding:5px 11px;border-radius:20px;font-weight:600;}
  .badge.flawless{background:var(--good-glow);color:var(--good);}
  .badge.excellent{background:var(--good-glow);color:var(--good);}
  .badge.good{background:var(--warn-glow);color:var(--warn);}
  .badge.failing{background:var(--danger-glow);color:var(--danger);}
  .badge.pending{background:var(--surface-3);color:var(--text-faint);}

  .esr-row{display:grid;grid-template-columns:70px 1fr 1fr 110px 130px;gap:12px;align-items:center;padding:12px;border-radius:14px;margin-bottom:10px;background:var(--surface);box-shadow:var(--raise-sm);}
  @media (max-width:760px){ .esr-row{grid-template-columns:1fr;} }
  .esr-row .params{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .file-pick{position:relative;}
  .file-pick input[type=file]{width:100%;font-size:11px;color:var(--text-dim);}
  .esr-score{font-family:var(--font-mono);font-size:15px;text-align:right;}

  .code-block{
    background:var(--surface-2);border-radius:16px;box-shadow:var(--press);padding:18px 20px;
    font-family:var(--font-mono);font-size:11.5px;line-height:1.7;color:var(--code-text);overflow-x:auto;
    white-space:pre;margin:14px 0;
  }
  .file-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
  .file-label span{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface);color:var(--text);
    padding:13px 22px;border-radius:16px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:50;box-shadow:var(--raise);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast.err{color:var(--danger);}
  .toast.ok{color:var(--good);}

  .hint{font-size:11.5px;color:var(--text-faint);margin-top:8px;line-height:1.6;}
  /* A short conclusion set apart from the prose around it, tinted by how it went. */
  .note{font-size:12.5px;line-height:1.65;padding:12px 14px;border-radius:12px;margin-top:10px;
        background:var(--surface-sunken,rgba(0,0,0,.035));border-left:3px solid var(--border-soft);}
  .note.good{background:var(--good-glow);border-left-color:var(--good);}
  .note.warn{background:var(--warn-glow);border-left-color:var(--warn);}
  .divider{height:1px;background:var(--border-soft);margin:22px 0;}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
  .kv span:first-child{color:var(--text-dim);}
  .kv span:last-child{font-family:var(--font-mono);color:var(--text);text-align:right;}

  /* ---- Quality slider: pressed track carrying the red-to-green scale ---- */
  #qualitySlider{
    -webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:10px;
    background:linear-gradient(90deg, var(--scale-0), var(--scale-1), var(--scale-2), var(--scale-3),
      var(--scale-4), var(--scale-5), var(--scale-6), var(--scale-7), var(--scale-8), var(--scale-9), var(--scale-10));
    outline:none;border:none;cursor:pointer;
    box-shadow:inset 2px 2px 5px var(--slider-well-d), inset -2px -2px 5px var(--slider-well-l);
  }
  #qualitySlider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--surface);border:none;cursor:pointer;margin-top:0;
    box-shadow:3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light);
  }
  #qualitySlider::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;background:var(--surface);border:none;cursor:pointer;
    box-shadow:3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light);
  }
  #qualitySlider::-moz-range-track{height:14px;border-radius:10px;border:none;}

  /* the row that is ready to record next */
  tr.next-up td{background:var(--accent-glow);}
  tr.next-up td:first-child{font-weight:700;color:var(--accent);}

  /* full-screen settings card, readable from across the room */
  .dial-backdrop{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .dial-card{
    width:100%;max-width:1200px;background:var(--surface);border-radius:26px;
    box-shadow:var(--raise);padding:40px 44px;text-align:center;
  }
  .dial-run{
    font-family:var(--font-mono);font-size:14px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);
  }
  .dial-line{
    font-family:var(--font-mono);font-weight:700;white-space:nowrap;
    line-height:1.15;margin:26px 0 18px;color:var(--text);overflow:hidden;
    font-variant-numeric:tabular-nums;
  }
  /* labels stay small so the numbers - the thing being read at distance - get
     as much of the width as possible */
  .dial-line .k{font-size:.34em;font-weight:500;color:var(--text-faint);letter-spacing:.06em;margin-right:.38em;}
  .dial-line .sep{font-size:.34em;color:var(--border);margin:0 .5em;}
  .val-name{font-size:.85em;color:var(--text-faint);}
  .dial-file{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);word-break:break-all;}
  .dial-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px;}
  @media (max-width:600px){ .dial-card{padding:24px 18px;} }
  /* While a take plays: the settings go grey - the moment to change them has
     passed - and Record blinks red, like a tape machine's record light. */
  .dial-card.recording .dial-line,
  .dial-card.recording .dial-line .k,
  .dial-card.recording .dial-line .sep{color:var(--text-faint);transition:color .3s;}
  .dial-card.recording .dial-file{opacity:.5;}
  .dial-card.recording #recGo,
  .dial-card.recording #recGo:disabled{
    opacity:1;cursor:default;color:#fff;background:#d7261e;
    box-shadow:0 0 0 4px rgba(215,38,30,.22), var(--raise-sm);
    animation:rec-blink 1.1s ease-in-out infinite;
  }
  @keyframes rec-blink{ 0%,100%{background:#d7261e;} 50%{background:#6e1410;} }
  @media (prefers-reduced-motion: reduce){ .dial-card.recording #recGo{animation:none;} }

  /* training progress */
  .pbar{height:12px;border-radius:8px;box-shadow:var(--press);overflow:hidden;margin:12px 0 8px;}
  .pbar > div{height:100%;background:var(--accent);transition:width .8s ease;}
  .pbar.busy > div{width:100% !important;opacity:.55;
    background:repeating-linear-gradient(45deg,var(--accent) 0 12px,transparent 12px 24px);
    background-size:34px 34px;animation:pbar-move 1s linear infinite;}
  @keyframes pbar-move{from{background-position:0 0;}to{background-position:34px 0;}}
  .clock{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion: reduce){ .pbar.busy > div{animation:none;} }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

<script>
(function(){
"use strict";

/* ============================= STATE ============================= */
const DEFAULT_KNOBS = [
  {name:"Drive", min:0, max:10},
  {name:"Tone", min:0, max:10},
  {name:"Volume", min:0, max:10},
];

const GEAR_PRESETS = [
  {group:"Pedals", name:"Maxon OD-9", knobs:[

  {group:"Pedals", name:"Ibanez TS9 Tube Screamer", knobs:[
    {name:"Drive", min:0, max:10}, {name:"Tone", min:0, max:10}, {name:"Level", min:0, max:10},
  ]},
  {group:"Pedals", name:"Boss DS-1 Distortion", knobs:[
    {name:"Distortion", min:0, max:10}, {name:"Tone", min:0, max:10}, {name:"Level", min:0, max:10},
  ]},
  {group:"Pedals", name:"ProCo RAT", knobs:[
    {name:"Distortion", min:0, max:10}, {name:"Filter", min:0, max:10}, {name:"Volume", min:0, max:10},
  ]},
  {group:"Pedals", name:"Klon-style Overdrive", knobs:[
    {name:"Gain", min:0, max:10}, {name:"Treble", min:0, max:10}, {name:"Output", min:0, max:10},
  ]},
  {group:"Pedals", name:"Electro-Harmonix Big Muff Pi", knobs:[
    {name:"Sustain", min:0, max:10}, {name:"Tone", min:0, max:10}, {name:"Volume", min:0, max:10},
  ]},
  {group:"Amps", name:"Marshall 1987x Reissue", knobs:[
    {name:"Presence", min:0, max:10}, {name:"Bass", min:0, max:10}, {name:"Middle", min:0, max:10},
    {name:"Treble", min:0, max:10}, {name:"Volume I (High Treb)", min:0, max:10}, {name:"Volume II (Normal)", min:0, max:10},
  ]},
  {group:"Amps", name:"Fender Deluxe Reverb (silverface)", knobs:[
    {name:"Volume", min:0, max:10}, {name:"Treble", min:0, max:10}, {name:"Bass", min:0, max:10},
    {name:"Reverb", min:0, max:10}, {name:"Speed (Vibrato)", min:0, max:10}, {name:"Intensity (Vibrato)", min:0, max:10},
  ]},
  {group:"Amps", name:"Vox AC30 (Top Boost)", knobs:[
    {name:"Normal Volume", min:0, max:10}, {name:"Brilliant Volume", min:0, max:10}, {name:"Treble", min:0, max:10},
    {name:"Bass", min:0, max:10}, {name:"Cut", min:0, max:10}, {name:"Master Volume", min:0, max:10},
  ]},
  {group:"Amps", name:"Mesa Boogie Dual Rectifier", knobs:[
    {name:"Gain", min:0, max:10}, {name:"Treble", min:0, max:10}, {name:"Middle", min:0, max:10},
    {name:"Bass", min:0, max:10}, {name:"Presence", min:0, max:10}, {name:"Master", min:0, max:10},
  ]},
  {group:"Custom", name:"Custom / blank", knobs:[
    {name:"Control 1", min:0, max:10}, {name:"Control 2", min:0, max:10},
  ]},
];

const state = {
  step: 0,
  ampName: "Maxon OD-9",
  knobs: DEFAULT_KNOBS.map(k=>({...k})),
  resolution: 0.5,
  trainN: 40,
  holdoutN: 6,
  includeEdgeCases: true,
  seed: 42,
  fileNamePattern: "{chain}_{type}_{run}",
  runPadding: 3,
  chains: [{name:"amp", delay:0}],   // one per simultaneously recorded signal chain
  chainSetup: {kind:"device", mics:1, direct:true},
  epochs: 400,
  modelName: "",
  capture: {            // devices, channels and the recordings folder
    outputDevice: null, inputDevice: null, outputChannel: 1,
    outDir: "", channels: {},
  },
  signalPreset: "v3",   // v3 | short
  theme: "",   // "", "light" or "dark"; empty follows the system
  validateChain: 0,
  trainMatrix: null,   // [{run, values:[...]}, ...]
  holdoutMatrix: null, // same shape, plus .edge flag
  runDone: {},          // training run -> bool (recording captured)
  holdoutDone: {},      // holdout run -> bool
  takeDelays: {},       // "train:12:amp" -> round trip measured on that take
  routeTest: null,      // last test-route reading
  esrResults: {},        // holdout run -> {score, ...}, first chain, for the export step
  knobFeatures: {},      // "train:12" -> measured features, for the recording check
  knobReview: {state:"idle", flagged:[], queue:[], rounds:0},
  training: null,        // {outDir, chains:[{name, modelName, runDir, files, bestEsr}]}
  trainChain: "all",
  validation: null,      // {chains:[{name, average, worst, runs}]}
  epochsV2: true,
};

// Everything that survives a reload or travels in a progress file. One list, so
// autosave, the progress file and loading one back cannot drift apart.
const PERSIST_KEYS = [
  'ampName','knobs','resolution','trainN','holdoutN','includeEdgeCases','seed','step',
  'fileNamePattern','runPadding','chains','chainSetup','epochs','modelName','capture',
  'signalPreset','theme','validateChain','trainMatrix','holdoutMatrix','runDone',
  'holdoutDone','takeDelays','routeTest','esrResults','knobFeatures','knobReview',
  'training','trainChain','validation','epochsV2',
];

const STORAGE_KEY = 'nam-matrix-forge-v2';   // unchanged on purpose: renaming it would orphan saved sessions
let savedSession = null;
try{
  savedSession = JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(savedSession && savedSession.knobs && savedSession.knobs.length){
    Object.assign(state, savedSession);
  }
}catch(e){}
migrateState(savedSession || {});

// Bring a session saved by an older version up to what this one expects.
function migrateState(saved){
  // Sessions saved before multi-chain support carried a single delay value.
  if(!Array.isArray(state.chains) || !state.chains.length){
    state.chains = [{name:"amp", delay: Number(saved.delaySamples) || 0}];
  }
  delete state.delaySamples;
  for(const key of ['runDone','holdoutDone','takeDelays','esrResults','knobFeatures'])
    if(!state[key] || typeof state[key] !== 'object') state[key] = {};
  // The knob check used to key its measurements by training run number alone.
  for(const k of Object.keys(state.knobFeatures)){
    if(/^\d+$/.test(k)){ state.knobFeatures['train:'+k] = state.knobFeatures[k]; delete state.knobFeatures[k]; }
  }
  if(!state.knobReview || typeof state.knobReview !== 'object')
    state.knobReview = {state:"idle", flagged:[], queue:[], rounds:0};
  // The app carries the reamp signals now; a custom file is no longer a thing.
  if(state.signalPreset !== 'short') state.signalPreset = 'v3';
  if(!state.capture || typeof state.capture !== 'object') state.capture = {};
  state.capture = {outputDevice:null, inputDevice:null, outputChannel:1, outDir:"", channels:{}, ...state.capture};
  delete state.capture.signalPath;
  if(!state.capture.channels || typeof state.capture.channels !== 'object') state.capture.channels = {};
  // 400 became the default; 200 was only ever the old default, not a choice.
  if(!state.epochsV2){
    if(!state.epochs || state.epochs === 200) state.epochs = 400;
    state.epochsV2 = true;
  }
  if(!state.chainSetup || typeof state.chainSetup !== 'object'){
    const n = state.chains.length;
    const mics = state.chains.filter(c => /mic|cab/i.test(c.name)).length;
    state.chainSetup = n === 1 && !mics ? {kind:"device", mics:1, direct:true}
      : {kind:"cab", mics: Math.max(1, mics || n - 1), direct: n > mics};
  }
}

function persist(){
  try{
    const out = {};
    for(const k of PERSIST_KEYS) out[k] = state[k];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(out));
  }catch(e){}
}

function clearSavedProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

const PROGRESS_FILE_VERSION = 3;
function snapshotProgress(){
  const snap = {tool: 'nam-matrix-forge-progress', version: PROGRESS_FILE_VERSION,
                savedAt: new Date().toISOString()};
  for(const k of PERSIST_KEYS) snap[k] = state[k];
  return snap;
}

async function saveProgressToFile(){
  const snap = snapshotProgress();
  const safeName = (state.ampName||'nam-profile').replace(/[^a-z0-9]+/gi,'_').toLowerCase();
  const doneCount = takesDone();
  const totalCount = allTakes().length;
  const stamp = new Date().toISOString().slice(0,10);
  await offerDownload(`${safeName}_progress_${doneCount}of${totalCount}_${stamp}.json`, JSON.stringify(snap, null, 2));
}

function loadProgressFromFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast('That file is not valid JSON.', 'err'); return; }
    if(!parsed || parsed.tool !== 'nam-matrix-forge-progress' || !Array.isArray(parsed.knobs) || !parsed.knobs.length){
      toast('That does not look like a NAMTRIX progress file.', 'err'); return;
    }
    for(const k of PERSIST_KEYS) if(Object.prototype.hasOwnProperty.call(parsed, k)) state[k] = parsed[k];
    // files from before these existed
    if(!('epochsV2' in parsed)) state.epochsV2 = false;
    if(!('chainSetup' in parsed)) state.chainSetup = null;
    if(!('holdoutDone' in parsed)) state.holdoutDone = {};
    if(!('knobReview' in parsed)) state.knobReview = null;
    if(typeof state.step !== 'number') state.step = 0;
    migrateState(parsed);
    persist();
    if(state.capture.outDir) allowRecordingsFolder();
    render();
    const doneCount = Object.values(state.runDone).filter(Boolean).length;
    toast(`Loaded progress: ${state.ampName}, ${doneCount}${state.trainMatrix?`/${state.trainMatrix.length}`:''} runs captured.`, 'ok');
  };
  reader.onerror = ()=> toast('Could not read that file.', 'err');
  reader.readAsText(file);
}

/* ============================= MATH: LHS ============================= */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function latinHypercube(dims, n, rng){
  const cols = [];
  for(let d=0; d<dims; d++){
    const strata = Array.from({length:n}, (_,i)=>i);
    for(let i=strata.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [strata[i],strata[j]] = [strata[j],strata[i]];
    }
    cols.push(strata.map(s => (s + rng())/n));
  }
  const rows = [];
  for(let i=0;i<n;i++) rows.push(cols.map(c=>c[i]));
  return rows; // n rows x dims, each in [0,1)
}

function snapValue(v, min, max, step){
  const snapped = Math.round(v/step)*step;
  const clamped = Math.min(max, Math.max(min, snapped));
  return Math.round(clamped*1000)/1000;
}

// Gain, lead, master, volume, level and output controls usually go silent at
// 0, and a silent take teaches the network nothing while costing a full run.
// Named ones skip 0 by default; any control can be switched either way on the
// Parameter Space step.
const AVOID_ZERO_NAMES = /\b(gain|lead|master|volume|vol|level|output)\b/i;
function avoidsZero(k){
  return typeof k.avoidZero === 'boolean' ? k.avoidZero : AVOID_ZERO_NAMES.test(k.name || '');
}

// Snap one knob's value, stepping off 0 to the nearest dialable neighbour when
// that knob avoids it.
function snapKnob(v, k){
  const step = state.resolution;
  const out = snapValue(v, k.min, k.max, step);
  if(out !== 0 || !avoidsZero(k)) return out;
  const up = snapValue(step, k.min, k.max, step);
  if(up !== 0) return up;
  const down = snapValue(-step, k.min, k.max, step);
  return down !== 0 ? down : out;     // a range of just 0 has nowhere else to go
}

function buildMatrix(n, seedOffset, edgeCases){
  const dims = state.knobs.length;
  const rng = mulberry32(state.seed + seedOffset);
  const raw = latinHypercube(dims, n, rng);
  const rows = raw.map((vec,i)=>({
    run: i+1,
    edge: false,
    values: vec.map((v,d)=>{
      const k = state.knobs[d];
      return snapKnob(k.min + v*(k.max-k.min), k);
    })
  }));
  if(edgeCases){
    const extra = [];
    const allMin = state.knobs.map(k=>k.min);
    const allMax = state.knobs.map(k=>k.max);
    // Everything at minimum is silent by construction, so ESR is meaningless for it:
    // the model correctly predicts silence and the whole residual is unpredictable
    // hiss, giving a ratio near 1.0 that would drag the holdout mean up. Kept as a
    // behavioural check on output level instead.
    extra.push({label:"all-min", values: allMin, silenceCheck: true});
    extra.push({label:"all-max", values: allMax});
    // alternating extremes, one run per knob flipped high vs rest low
    const altA = state.knobs.map((k,i)=> i%2===0 ? k.max : k.min);
    const altB = state.knobs.map((k,i)=> i%2===0 ? k.min : k.max);
    extra.push({label:"alt-A", values: altA});
    extra.push({label:"alt-B", values: altB});
    extra.forEach((e,i)=>{
      rows.push({run: n+i+1, edge:true, label:e.label, silenceCheck: !!e.silenceCheck,
                 values: e.values.map((v,d)=>snapKnob(v, state.knobs[d]))});
    });
  }
  return rows;
}

function isEdgeByValues(row){
  // flags rows sitting at or near the extremes of >=2 dimensions
  let extremeCount = 0;
  row.values.forEach((v,d)=>{
    const k = state.knobs[d];
    const range = k.max-k.min;
    if(Math.abs(v-k.min) <= range*0.1 || Math.abs(v-k.max) <= range*0.1) extremeCount++;
  });
  return extremeCount >= Math.ceil(row.values.length*0.5);
}

/* ============================= HELPERS ============================= */
function toast(msg, kind){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind?(' '+kind):'');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.className='toast'; }, 3200);
}

function csvCell(v){
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}

function csvFor(matrix, kind){
  const sepVal = signalPreset().separateVal && kind === 'train';
  const fileCols = state.chains.flatMap(c =>
    sepVal ? [`File (${c.name})`, `Validation file (${c.name})`] : [`File (${c.name})`]);
  const header = ['Run', ...fileCols, ...state.knobs.map(k=>k.name), 'Type'].map(csvCell).join(',');
  const lines = matrix.map(r => [
    r.run,
    ...state.chains.flatMap(c => sepVal
      ? [fileNameFor(r, kind, c.name), fileNameFor(r, kind, c.name, 'val')]
      : [fileNameFor(r, kind, c.name)]),
    ...r.values,
    r.edge?'edge-case':'grid'
  ].map(csvCell).join(','));
  return [header, ...lines].join('\n');
}

function chainsCsv(){
  const header = ['Chain', 'Delay (samples)', 'Example training file', 'Example holdout file'].map(csvCell).join(',');
  const t0 = state.trainMatrix && state.trainMatrix[0];
  const h0 = state.holdoutMatrix && state.holdoutMatrix[0];
  const lines = state.chains.map(c => [
    c.name,
    c.delay,
    t0 ? fileNameFor(t0, 'train', c.name) : '',
    h0 ? fileNameFor(h0, 'holdout', c.name) : ''
  ].map(csvCell).join(','));
  return [header, ...lines].join('\n');
}

function slug(s){ return String(s||'').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'').toLowerCase(); }

function fileNameTokens(row, kind, chainName){
  const pad = Math.max(1, Math.min(6, parseInt(state.runPadding,10) || 1));
  return {
    run: String(row.run).padStart(pad,'0'),
    type: kind === 'holdout' ? 'holdout' : 'run',
    gear: slug(state.ampName) || 'gear',
    chain: slug(chainName ?? (state.chains[0] && state.chains[0].name)) || 'chain',
    values: row.values.map(v=>String(v).replace('.','p')).join('-'),
  };
}

function fileNameFor(row, kind, chainName, part){
  const tokens = fileNameTokens(row, kind, chainName);
  const suffix = part === 'val' ? '_val' : '';
  const pattern = (state.fileNamePattern || '').trim() || '{type}_{run}';
  const name = pattern
    .replace(/\{(\w+)\}/g, (m,k)=> Object.prototype.hasOwnProperty.call(tokens,k) ? tokens[k] : m)
    .replace(/\.wav$/i,'')
    .replace(/[\\/:*?"<>|\s]+/g,'_');
  return (name || `${tokens.type}_${tokens.run}`) + suffix + '.wav';
}

/* ---- takes: one recording session of one run, every chain at once ---- */
function takeId(kind, run){ return `${kind}:${run}`; }
function isDone(kind, run){ return !!(kind === 'holdout' ? state.holdoutDone : state.runDone)[run]; }
function setDone(kind, run, v){ (kind === 'holdout' ? state.holdoutDone : state.runDone)[run] = !!v; }
function allTakes(){
  return [
    ...(state.trainMatrix || []).map(row => ({kind:'train', row, id: takeId('train', row.run)})),
    ...(state.holdoutMatrix || []).map(row => ({kind:'holdout', row, id: takeId('holdout', row.run)})),
  ];
}
function takeById(id){ return allTakes().find(t => t.id === id) || null; }
function takesDone(){ return allTakes().filter(t => isDone(t.kind, t.row.run)).length; }
function allRecorded(){
  const all = allTakes();
  return all.length > 0 && all.every(t => isDone(t.kind, t.row.run));
}
// A re-record round goes first, then the run sheet in order: training, holdout.
function nextPendingTake(){
  for(const id of (state.knobReview && state.knobReview.queue) || []){
    const t = takeById(id);
    if(t && !isDone(t.kind, t.row.run)) return t;
  }
  return allTakes().find(t => !isDone(t.kind, t.row.run)) || null;
}
// Holdout runs play the training signal only; the short signal's separate
// validation cut is for training, which never sees a holdout.
function takeParts(kind){ return signalPreset().separateVal && kind === 'train' ? ['main','val'] : ['main']; }
function joinPath(dir, name){ return String(dir || '').replace(/\/+$/, '') + '/' + name; }
function takePath(kind, row, chainName, part){ return joinPath(state.capture.outDir, fileNameFor(row, kind, chainName, part)); }
function takeDelay(kind, run, chain){
  const d = state.takeDelays[`${kind}:${run}:${chain.name}`];
  return Number.isFinite(d) ? d : (Number(chain.delay) || 0);
}

function matrixFits(matrix){
  return !!matrix && matrix.every(r => r.values.length === state.knobs.length);
}
function matrixValid(){
  return matrixFits(state.trainMatrix) && matrixFits(state.holdoutMatrix);
}
function matrixStale(){
  return !!state.trainMatrix && !matrixValid();
}
function discardMatrix(){
  state.trainMatrix = null;
  state.holdoutMatrix = null;
  forgetTakes();
}
function confirmStructureChange(action){
  if(!state.trainMatrix) return true;
  const captured = Object.values(state.runDone).filter(Boolean).length;
  const ok = confirm(`${action} changes the control list, so the generated matrix (${state.trainMatrix.length} runs, ${captured} captured) no longer fits and will be cleared. You'll need to regenerate it.\n\nTip: use "Save progress" first if you want to keep the current session. Continue?`);
  if(ok) discardMatrix();
  return ok;
}

function saveViaBrowser(filename, data){
  const type = /\.json$/i.test(filename) ? 'application/json' : /\.csv$/i.test(filename) ? 'text/csv' : 'text/plain';
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast(`Downloaded ${filename}`, 'ok');
}

async function offerDownload(filename, data){
  const api = window.claude;
  if(!api || typeof api.use !== 'function'){
    // Opened as a plain file outside claude.ai: the page can save directly.
    saveViaBrowser(filename, data);
    return;
  }
  try{
    const downloads = await api.use("downloads");
    if(!downloads){ fallbackDownloadNotice(); return; }
    const res = await downloads.save({filename, data});
    toast(res.status === 'saved' ? `Saved ${filename}` : `Sent ${filename}`, 'ok');
  }catch(err){
    if(err && err.code === 'declined'){ return; }
    toast('Download unavailable in this view: ' + (err && err.message ? err.message : 'unknown error'), 'err');
  }
}
function fallbackDownloadNotice(){
  toast('Downloads are not available in this preview context.', 'err');
}


/* ============================= SCRIPT TEMPLATES ============================= */
function pyGenerateLHS(){
  const knobList = state.knobs.map(k=>`    "${k.name}"`).join(',\n');
  return `"""
Regenerate or extend the OED run-sheet for parametric NAM profiling of
${state.ampName}, using scipy's Latin Hypercube sampler.

This mirrors the matrix built in NAMTRIX (browser tool), so you
can reproduce it, or generate larger/additional batches from the CLI.
Requires: pip install numpy scipy
"""
import csv
import numpy as np
from scipy.stats import qmc

KNOBS = [
${knobList}
]
N_SAMPLES = ${state.trainN}          # number of reamp runs to generate
SEED = ${state.seed}
STEP = ${state.resolution}           # physical resolution you can reliably dial
MIN_VAL, MAX_VAL = ${state.knobs[0].min}.0, ${state.knobs[0].max}.0
# Controls kept off 0, where they usually go silent (gain, lead, master...)
AVOID_ZERO = [${state.knobs.map((k,i)=>avoidsZero(k)?i:null).filter(i=>i!==null).join(', ')}]

# File naming - tokens: {run} {type} {gear} {values}
FILE_PATTERN = "${(state.fileNamePattern||'{type}_{run}').replace(/\\/g,'').replace(/"/g,'')}"
RUN_PADDING = ${Math.max(1, Math.min(6, parseInt(state.runPadding,10) || 1))}
GEAR = "${slug(state.ampName) || 'gear'}"

def file_name(run, values):
    tokens = {
        "run": str(run).zfill(RUN_PADDING),
        "type": "run",
        "gear": GEAR,
        "values": "-".join(f"{v:g}".replace(".", "p") for v in values),
    }
    name = FILE_PATTERN
    for key, val in tokens.items():
        name = name.replace("{" + key + "}", val)
    return name + ".wav"

def main():
    sampler = qmc.LatinHypercube(d=len(KNOBS), seed=SEED)
    sample = sampler.random(n=N_SAMPLES)                 # values in [0, 1)
    scaled = qmc.scale(sample, [MIN_VAL]*len(KNOBS), [MAX_VAL]*len(KNOBS))

    # Snap to the nearest hash mark you can accurately dial by hand.
    # This is a "Discrete Latin Hypercube": it slightly degrades the
    # mathematical perfection of the hypercube but preserves its
    # space-filling property, which is what the network actually needs.
    snapped = np.round(scaled / STEP) * STEP
    snapped = np.clip(snapped, MIN_VAL, MAX_VAL)
    for col in AVOID_ZERO:
        snapped[snapped[:, col] == 0, col] = min(STEP, MAX_VAL)

    with open("train_matrix_regenerated.csv", "w", newline="") as f:
        writer = csv.writer(f)
        writer.writerow(["Run", "File"] + KNOBS + ["Type"])
        for i, row in enumerate(snapped, start=1):
            values = [round(float(v), 3) for v in row]
            writer.writerow([i, file_name(i, values)] + values + ["grid"])

    print(f"Wrote {N_SAMPLES} runs across {len(KNOBS)} dimensions "
          f"to train_matrix_regenerated.csv")

if __name__ == "__main__":
    main()
`;
}

function pyAlignDataset(){
  return `"""
Build the (Input Audio, Parameter Vector, Output Audio) triplet manifest
that a parametric NAM trainer expects, from a CSV run-sheet and a folder
of recorded WAV files. Names are read from that chain's "File (<chain>)"
column (pattern: ${(state.fileNamePattern||'{chain}_{type}_{run}')}, e.g. ${state.trainMatrix && state.trainMatrix[0] ? fileNameFor(state.trainMatrix[0],'train',(state.chains[0]||{}).name) : 'amp_run_001.wav'}).

Requires: pip install (none beyond stdlib)
"""
import csv
import json
import sys
from pathlib import Path

CSV_PATH = "train_matrix.csv"
AUDIO_DIR = Path("recordings")
INPUT_DI_FILE = "di_input.wav"      # the dry NAM test signal you played through the device
OUTPUT_MANIFEST = "dataset_manifest.json"

# One profile per capture chain. Pick the chain to build a dataset for; its
# delay goes in your trainer's data config (NAM: common.delay).
CHAIN = "${(state.chains[0] && state.chains[0].name) || 'amp'}"
CHAIN_DELAY_SAMPLES = ${(state.chains[0] && state.chains[0].delay) || 0}
# Chains in this session: ${state.chains.map(c=>`${c.name} (delay ${c.delay})`).join(', ')}

def main():
    with open(CSV_PATH, newline="") as f:
        reader = csv.DictReader(f)
        file_col = f"File ({CHAIN})"
        if file_col not in reader.fieldnames:
            raise SystemExit(
                f"No column {file_col!r} in {CSV_PATH}. Available: {reader.fieldnames}"
            )
        non_knob = {"Run", "Type"} | {c for c in reader.fieldnames if c.startswith("File")}
        knob_names = [c for c in reader.fieldnames if c not in non_knob]
        triplets = []
        missing = 0
        for row in reader:
            wav_name = row[file_col]
            wav_path = AUDIO_DIR / wav_name
            if not wav_path.exists():
                print(f"WARNING: missing {wav_path}", file=sys.stderr)
                missing += 1
                continue
            triplets.append({
                "input": INPUT_DI_FILE,
                "output": str(wav_path),
                "params": {k: float(row[k]) for k in knob_names},
            })

    with open(OUTPUT_MANIFEST, "w") as f:
        json.dump(triplets, f, indent=2)

    print(f"Wrote {len(triplets)} triplets for chain {CHAIN!r} to {OUTPUT_MANIFEST} "
          f"({missing} recordings missing). Delay for this chain: "
          f"{CHAIN_DELAY_SAMPLES} samples")

if __name__ == "__main__":
    main()
`;
}

function pyCalculateESR(){
  return `"""
Offline Error-to-Signal Ratio (ESR) calculator for validating a trained
parametric NAM model against a holdout recording it never trained on.

    ESR = sum((y - y_hat)^2) / sum(y^2)

Usage:
    python calculate_esr.py real_amp.wav model_prediction.wav [delay_samples]

delay_samples: how many samples the REAL recording lags the model output
(that chain's round-trip latency). Each capture chain has its OWN delay --
using one chain's figure on another misaligns it.
This session: ${state.chains.map(c=>`${c.name} = ${c.delay}`).join(', ')}.
Defaults to ${(state.chains[state.validateChain] || state.chains[0] || {delay:0}).delay}.

Requires: pip install numpy soundfile
"""
import sys
import numpy as np
import soundfile as sf

THRESHOLDS = [
    (0.005, "Flawless - indistinguishable from the real amp"),
    (0.015, "Excellent - identical in a mix, microscopic differences solo"),
    (0.05,  "Good, but imperfect - core tone captured, edges differ"),
    (float("inf"), "Failing - noticeably different from the real amp"),
]

def load_mono(path):
    data, sr = sf.read(path, always_2d=False)
    if data.ndim > 1:
        data = data.mean(axis=1)
    return data.astype(np.float64), sr

def esr(y, y_hat, delay=0):
    if delay > 0:
        y = y[delay:]
    elif delay < 0:
        y_hat = y_hat[-delay:]
    n = min(len(y), len(y_hat))
    y, y_hat = y[:n], y_hat[:n]
    error_energy = np.sum((y - y_hat) ** 2)
    signal_energy = np.sum(y ** 2)
    return error_energy / signal_energy if signal_energy > 0 else float("inf")

def interpret(score):
    for ceiling, label in THRESHOLDS:
        if score < ceiling:
            return label
    return THRESHOLDS[-1][1]

def main():
    if len(sys.argv) not in (3, 4):
        print("Usage: python calculate_esr.py <real_amp.wav> <model_prediction.wav> [delay_samples]")
        sys.exit(1)
    delay = int(sys.argv[3]) if len(sys.argv) == 4 else ${(state.chains[state.validateChain] || state.chains[0] || {delay:0}).delay}

    y, sr1 = load_mono(sys.argv[1])
    y_hat, sr2 = load_mono(sys.argv[2])
    if sr1 != sr2:
        print(f"WARNING: sample rate mismatch ({sr1} vs {sr2})")

    score = esr(y, y_hat, delay)
    print(f"ESR: {score:.6f}  (delay compensation: {delay} samples)")
    print(interpret(score))

if __name__ == "__main__":
    main()
`;
}

/* ========================= KNOB CHECK =========================
 * Did a knob actually sit where the run sheet says it did?
 *
 * Every run plays the same input signal, so two takes differ only by where the
 * knobs were. That is what makes this possible without a reference model, an
 * alignment step, or a trained network: the takes are directly comparable.
 *
 * Knob settings predict sound, and they do it smoothly. So a run's sound should
 * be predictable from the other runs. When a run disagrees with what every
 * other run says it should be, the run sheet is a likelier culprit than the amp.
 *
 * Three things had to be right for this to work on real captures rather than
 * only on tidy synthetic ones:
 *
 *   1. Narrow bands, not broad ones. "Everything above 2 kHz" tracked this
 *      amp's tone stack with an R^2 of 0.05. Eleven third-octave-ish bands
 *      track it at 0.7 to 0.85.
 *   2. The model's complexity chosen from the data. With 35 runs and 6 knobs a
 *      quadratic term overfits, and its leave-one-out error is 40% worse than a
 *      plain linear fit on the feature that matters most.
 *   3. A matched filter, not a per-feature threshold. One knob moves several
 *      bands together, by a fixed pattern. Testing that whole pattern at once is
 *      what turns an undetectable error into a detectable one - on this amp it
 *      is the difference between needing an 11-unit error and a 5-unit one.
 * ============================================================= */

// Band edges across the guitar range, roughly third-octave where tone controls
// act. Relative levels, so the interface's gain trim cannot masquerade as a knob.
const KC_BAND_EDGES = [60,120,200,320,500,800,1250,2000,3150,5000,8000,12000];

// `floor` is the smallest spread that will ever be believed. Without it an
// unusually consistent set of runs divides by nearly nothing and every run
// becomes a fault.
const KC_FEATURES = [
  {key:"rms",      label:"level",         unit:"dB", floor:0.30},
  {key:"crest",    label:"crest factor",  unit:"dB", floor:0.30},
  {key:"dynamics", label:"dynamic range", unit:"dB", floor:0.40},
];
for(let i=0;i<KC_BAND_EDGES.length-1;i++){
  const lo = KC_BAND_EDGES[i], hi = KC_BAND_EDGES[i+1];
  const name = hi >= 1000 ? `${(lo/1000).toFixed(lo<1000?1:0)}-${(hi/1000).toFixed(0)} kHz`
                          : `${lo}-${hi} Hz`;
  KC_FEATURES.push({key:`b${i}`, label:name, unit:"dB", floor:0.35, band:true, lo, hi});
}

const KC_MIN_RUNS   = 12;   // below this there is no population to compare against
const KC_FLAG_Z     = 4.0;  // a false alarm costs a re-record, so be reluctant
const KC_EXPLAIN_Z  = 2.5;  // what must be left over for an answer to count
const KC_ODD_Z      = 5.5;  // "unlike any other run", with no knob to blame
const KC_SILENT_DBFS = -45; // matches the ESR validator's own silence threshold
// Leverage past this multiple of average means the model extrapolated to reach
// this run, and a guess is not grounds for making someone re-record.
const KC_MAX_LEVERAGE_RATIO = 4.0;
// Statistics alone will happily flag a knob a third of a detent out. Nobody can
// set a pointer knob that accurately, and the matrix snaps to detents anyway, so
// an error has to be this big before it is worth interrupting someone over:
// either a couple of real detents, or a tenth of the knob's travel.
const KC_MIN_STEPS = 1.5;
const KC_MIN_TRAVEL = 0.08;

/* ---------- FFT: iterative radix-2, in place ---------- */
function kcFFT(re, im){
  const n = re.length;
  for(let i=1, j=0; i<n; i++){
    let bit = n >> 1;
    for(; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if(i < j){ const tr=re[i]; re[i]=re[j]; re[j]=tr; const ti=im[i]; im[i]=im[j]; im[j]=ti; }
  }
  for(let len=2; len<=n; len<<=1){
    const ang = -2*Math.PI/len, wr = Math.cos(ang), wi = Math.sin(ang);
    for(let i=0; i<n; i+=len){
      let cr = 1, ci = 0;
      for(let k=0; k<len/2; k++){
        const ur=re[i+k], ui=im[i+k];
        const vr=re[i+k+len/2]*cr - im[i+k+len/2]*ci;
        const vi=re[i+k+len/2]*ci + im[i+k+len/2]*cr;
        re[i+k]=ur+vr; im[i+k]=ui+vi;
        re[i+k+len/2]=ur-vr; im[i+k+len/2]=ui-vi;
        const ncr = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = ncr;
      }
    }
  }
}

const KC_FFT_SIZE = 4096;
const KC_MAX_BLOCKS = 240;   // enough to average down, cheap enough to stay instant

/* ---------- what one take measures as ---------- */
function kcFeatures(samples, sampleRate){
  const n = samples.length;
  if(!n) return null;

  let sumSq = 0, peak = 0;
  for(let i=0;i<n;i++){ const v=samples[i]; sumSq += v*v; const a=v<0?-v:v; if(a>peak) peak=a; }
  const rmsLin = Math.sqrt(sumSq/n);
  const toDb = v => v>0 ? 20*Math.log10(v) : -Infinity;
  const rms = toDb(rmsLin);

  const blank = () => {
    const o = {silent:true, rms, crest:0, dynamics:0};
    for(let i=0;i<KC_BAND_EDGES.length-1;i++) o[`b${i}`] = 0;
    return o;
  };
  // Every control at minimum makes the amp silent. That is correct behaviour,
  // not a fault, and silence has no spectrum to compare.
  if(!(rmsLin > 0) || rms < KC_SILENT_DBFS) return blank();

  // Welch-style average over blocks spread across the whole take, so a loud
  // opening cannot stand in for the rest of it.
  const size = KC_FFT_SIZE, half = size>>1;
  const nBlocks = Math.max(1, Math.min(KC_MAX_BLOCKS, Math.floor(n/size)));
  const stride = Math.max(size, Math.floor((n - size)/Math.max(1,nBlocks-1)) || size);
  const win = new Float64Array(size);
  for(let i=0;i<size;i++) win[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/(size-1));
  const power = new Float64Array(half);
  const re = new Float64Array(size), im = new Float64Array(size);
  let used = 0;
  for(let b=0; b<nBlocks; b++){
    const start = b*stride;
    if(start + size > n) break;
    let blockE = 0;
    for(let i=0;i<size;i++){ const v = samples[start+i]; blockE += v*v; }
    if(blockE <= 0) continue;                    // a silent block carries no colour
    for(let i=0;i<size;i++){ re[i] = samples[start+i]*win[i]; im[i] = 0; }
    kcFFT(re, im);
    for(let k=0;k<half;k++) power[k] += re[k]*re[k] + im[k]*im[k];
    used++;
  }
  if(!used) return blank();

  const binHz = sampleRate/size;
  const nBands = KC_BAND_EDGES.length-1;
  const acc = new Float64Array(nBands);
  let total = 0;
  for(let k=1;k<half;k++){
    const f = k*binHz;
    if(f < 25 || f > 16000) continue;            // rumble and the anti-alias filter
    total += power[k];
    for(let i=0;i<nBands;i++){
      if(f >= KC_BAND_EDGES[i] && f < KC_BAND_EDGES[i+1]){ acc[i] += power[k]; break; }
    }
  }
  if(!(total > 0)) return blank();

  // Dynamic range: the spread of short-block levels. A saturating amp squashes
  // it, which is what makes this read Drive rather than Volume.
  const blockLen = Math.max(1, Math.round(0.1*sampleRate));
  const levels = [];
  for(let s=0; s+blockLen<=n; s+=blockLen){
    let e=0; for(let i=0;i<blockLen;i++){ const v=samples[s+i]; e+=v*v; }
    const r = Math.sqrt(e/blockLen);
    if(r > 0) levels.push(20*Math.log10(r));
  }
  levels.sort((a,b)=>a-b);
  const pct = q => levels.length
    ? levels[Math.min(levels.length-1, Math.max(0, Math.round(q*(levels.length-1))))] : 0;

  const out = {
    silent: false,
    rms,
    crest: toDb(peak) - rms,
    dynamics: levels.length >= 8 ? pct(0.95) - pct(0.25) : 0,
  };
  // Floor relative to the take's own energy, never absolute: an absolute one
  // would bite on a quiet take and not on a loud one, which is exactly the
  // level dependence these bands exist to avoid.
  const bandFloor = 1e-12*total;
  for(let i=0;i<nBands;i++) out[`b${i}`] = 10*Math.log10(Math.max(acc[i],bandFloor)/total);
  return out;
}

/* ---------- knob space ---------- */
function kcNormalise(values, knobs){
  return values.map((v,i)=>{
    const k = knobs[i];
    const span = (k.max - k.min) || 1;
    return (Number(v) - k.min)/span;
  });
}

function kcMedian(xs){
  if(!xs.length) return 0;
  const s = xs.slice().sort((a,b)=>a-b), m = s.length>>1;
  return s.length%2 ? s[m] : 0.5*(s[m-1]+s[m]);
}
const kcMad = (xs) => { const m = kcMedian(xs); return kcMedian(xs.map(v=>Math.abs(v-m))); };

/* ---------- small dense linear algebra ---------- */
// Gauss-Jordan with partial pivoting, several right-hand sides at once. The
// systems here are at most 13x13, so nothing cleverer is warranted.
function kcSolve(A, rhsList){
  const n = A.length, m = rhsList.length;
  const M = A.map((row,i)=>{ const r = Array.from(row); for(const b of rhsList) r.push(b[i]); return r; });
  for(let c=0;c<n;c++){
    let piv = c;
    for(let r=c+1;r<n;r++) if(Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if(Math.abs(M[piv][c]) < 1e-12) return null;
    [M[c], M[piv]] = [M[piv], M[c]];
    for(let r=0;r<n;r++){
      if(r===c) continue;
      const factor = M[r][c]/M[c][c];
      if(!factor) continue;
      for(let k=c;k<n+m;k++) M[r][k] -= factor*M[c][k];
    }
  }
  const out = [];
  for(let j=0;j<m;j++) out.push(M.map((row,i)=>row[n+j]/M[i][i]));
  return out;
}

/*
 * The response model: one smooth curve per knob, added together.
 *
 *   linear     feature = b0 + sum_j b_j*u_j
 *   quadratic  feature = b0 + sum_j (b_j*u_j + c_j*u_j^2),    u_j = knob_j - 0.5
 *
 * Which one is used is decided by the data, not in advance, because the right
 * answer changes with how many runs there are. On 35 runs and 6 knobs the
 * quadratic term overfits badly. On a three-knob pedal with 40 runs it earns
 * its place. Leave-one-out error picks between them.
 *
 * Either way it assumes knobs act mostly independently. They do not act
 * *entirely* independently - a tone stack interacts - but the leftover lands in
 * the residuals, which widens the spread and makes the check more cautious
 * rather than wrong.
 */
const KC_ROWS = {
  linear:    x => { const r=[1]; for(const v of x) r.push(v-0.5); return r; },
  quadratic: x => { const r=[1]; for(const v of x){ const u=v-0.5; r.push(u,u*u); } return r; },
};

function kcFit(points, knobCount, shape){
  const rowFn = KC_ROWS[shape];
  const cols = rowFn(points[0].x).length;
  if(points.length < cols + 2) return null;

  const A = []; for(let i=0;i<cols;i++) A.push(new Float64Array(cols));
  const rhs = KC_FEATURES.map(()=>new Float64Array(cols));
  for(const pt of points){
    const row = rowFn(pt.x);
    for(let a=0;a<cols;a++){
      for(let b=0;b<cols;b++) A[a][b] += row[a]*row[b];
      KC_FEATURES.forEach((f,fi)=>{ rhs[fi][a] += row[a]*pt.f[f.key]; });
    }
  }
  // Ridge on the shape terms only, never the intercept: a knob that never moved
  // should flatten to "no effect" rather than pick up a wild coefficient.
  let trace = 0; for(let j=1;j<cols;j++) trace += A[j][j];
  for(let j=1;j<cols;j++) A[j][j] += 1e-4*(trace/Math.max(1,cols-1)) + 1e-9;

  const solved = kcSolve(A, rhs);
  if(!solved) return null;
  const coef = {};
  KC_FEATURES.forEach((f,fi)=>{ coef[f.key] = solved[fi]; });

  const eye = [];
  for(let i=0;i<cols;i++){ const e = new Float64Array(cols); e[i] = 1; eye.push(e); }
  const inv = kcSolve(A, eye);

  return {
    shape, cols, n: points.length,
    predict(x){
      const row = rowFn(x), out = {};
      for(const f of KC_FEATURES){
        let v = 0; const c = coef[f.key];
        for(let i=0;i<row.length;i++) v += row[i]*c[i];
        out[f.key] = v;
      }
      return out;
    },
    // d(feature)/d(normalised knob j): what turns "this run is wrong" into
    // "this knob is wrong, and by this much".
    gradient(x){
      const out = {};
      for(const f of KC_FEATURES){
        const c = coef[f.key], g = [];
        for(let j=0;j<knobCount;j++){
          g.push(shape === "linear" ? c[1+j] : c[1+2*j] + 2*c[2+2*j]*(x[j]-0.5));
        }
        out[f.key] = g;
      }
      return out;
    },
    // How far outside the fitted data a point sits, in the regression's own
    // terms. Around cols/n for a typical run; several times that means the
    // model is guessing.
    leverage(x){
      if(!inv) return Infinity;
      const row = rowFn(x);
      let h = 0;
      for(let a=0;a<cols;a++){
        let acc = 0;
        for(let b=0;b<cols;b++) acc += inv[b][a]*row[b];
        h += row[a]*acc;
      }
      return h;
    },
  };
}

// Fit every shape the data can support and keep the one that predicts runs it
// has not seen best. More parameters always fit the runs you have better, which
// is exactly why that is not the thing to measure.
function kcChooseShape(pts, K){
  let best = null;
  for(const shape of ["linear","quadratic"]){
    // A model with nearly as many coefficients as runs will fit anything, and
    // its slopes go wild - which makes the check report a sensitivity it does
    // not have. Three runs per coefficient before a shape is even considered.
    const cols = KC_ROWS[shape](pts[0].x).length;
    if(pts.length < 3*cols) continue;
    const errs = [];
    for(const p of pts){
      const fit = kcFit(pts.filter(q=>q!==p), K, shape);
      if(!fit) { errs.length = 0; break; }
      const pred = fit.predict(p.x);
      for(const f of KC_FEATURES) errs.push(Math.abs(p.f[f.key] - pred[f.key])/f.floor);
    }
    if(!errs.length) continue;
    const score = kcMedian(errs);
    if(!best || score < best.score) best = {shape, score};
  }
  return best && best.shape;
}

/**
 * Check every analysed run against what the other runs say it should sound like.
 *
 * `runs`  [{run, values:[...], f:{features}}]
 * `knobs` [{name, min, max, step}]
 */
function kcAnalyse(runs, knobs, opts){
  opts = opts || {};
  const flagZ    = opts.flagZ    || KC_FLAG_Z;
  const explainZ = opts.explainZ || KC_EXPLAIN_Z;
  const oddZ     = opts.oddZ     || KC_ODD_Z;
  const usable = runs.filter(r => r.f && !r.f.silent);
  const silentCount = runs.filter(r => r.f && r.f.silent).length;
  const K = knobs.length;
  // Enough runs to pin down a linear response with room to spare. Fewer than
  // this and the residual spread is mostly the model's own uncertainty, which
  // would make the check confidently wrong about its own resolution.
  const need = Math.max(KC_MIN_RUNS, 3*(K + 1));

  if(usable.length < need){
    return {ready:false, analysed:usable.length, silentCount, findings:[], needed:need,
      reason:`Needs ${need} analysed runs before it can tell a mis-set knob from ordinary `
           + `variation; ${usable.length} so far.`};
  }

  const pts = usable.map(r => ({run:r.run, x:kcNormalise(r.values, knobs), f:r.f, values:r.values}));
  const shape = kcChooseShape(pts, K);
  if(!shape){
    return {ready:false, analysed:usable.length, silentCount, findings:[], needed:need,
      reason:`With ${K} knobs this needs at least ${3*(K+1)} analysed runs to model the amp `
           + `without fitting the noise; ${usable.length} so far.`};
  }

  // Leave one out, always. A run fitted partly to itself would drag the model
  // towards its own mistake and then look innocent - which is precisely the run
  // this exists to catch.
  const preds = {}, grads = {}, levs = {};
  for(const p of pts){
    const fit = kcFit(pts.filter(q => q !== p), K, shape);
    if(!fit) continue;
    preds[p.run] = fit.predict(p.x);
    grads[p.run] = fit.gradient(p.x);
    levs[p.run]  = fit.leverage(p.x)/(fit.cols/fit.n);   // 1.0 is an average run
  }
  const judged = pts.filter(p => preds[p.run]);
  if(judged.length < need){
    return {ready:false, analysed:usable.length, silentCount, findings:[], needed:need,
      reason:"The runs recorded so far do not vary enough to fit a model."};
  }

  // Robust spread per feature. A mean and a standard deviation would be dragged
  // about by the very outliers this exists to find; a median absolute deviation
  // is not.
  const scale = {};
  for(const f of KC_FEATURES){
    const rs = judged.map(p => p.f[f.key] - preds[p.run][f.key]);
    scale[f.key] = Math.max(1.4826*kcMad(rs), f.floor);
  }
  const zOf = p => KC_FEATURES.map(f => (p.f[f.key] - preds[p.run][f.key])/scale[f.key]);

  // The matched filter, whitened.
  //
  // One knob moves a whole set of bands together, by a pattern the model already
  // knows, so testing for the entire pattern at once beats asking whether any
  // single band looks wrong. But bands do not vary independently: a take that is
  // generally darker is darker across every high band at once. Left alone, that
  // ordinary drift looks exactly like a tone control moving, and it costs a
  // factor of two and a half - a Treble error that needs 3.6 knob units to show
  // up stays buried until 8.5.
  //
  // So the residuals are decorrelated first and the knob's pattern tested in
  // that space. Directions where takes drift about on their own are discounted;
  // directions peculiar to one knob are not.
  const F = KC_FEATURES.length;
  const zs = {};
  for(const p of judged) zs[p.run] = zOf(p);

  // Covariance of the residuals, over the tidier three quarters of the runs.
  // Trimming stops the very outliers this is hunting from widening the noise
  // model that is meant to reveal them.
  const byNorm = judged.slice().sort((a,b)=>
    zs[a.run].reduce((s,v)=>s+v*v,0) - zs[b.run].reduce((s,v)=>s+v*v,0));
  const clean = byNorm.slice(0, Math.max(K+2, Math.ceil(0.75*byNorm.length)));
  const cov = [];
  for(let a=0;a<F;a++) cov.push(new Float64Array(F));
  for(const p of clean){
    const z = zs[p.run];
    for(let a=0;a<F;a++) for(let b=0;b<F;b++) cov[a][b] += z[a]*z[b];
  }
  for(let a=0;a<F;a++) for(let b=0;b<F;b++) cov[a][b] /= clean.length;

  // Shrink towards the identity. Estimating a full covariance from a few dozen
  // runs is hopeless on its own; shrinkage makes it usable, and leans harder on
  // the identity the fewer runs there are.
  const alpha = Math.min(0.9, Math.max(0.15, (F + 2)/(clean.length + F)));
  for(let a=0;a<F;a++){
    for(let b=0;b<F;b++) cov[a][b] *= (1 - alpha);
    cov[a][a] += alpha;
  }
  const eyeF = [];
  for(let i=0;i<F;i++){ const e = new Float64Array(F); e[i] = 1; eyeF.push(e); }
  const covInv = kcSolve(cov, eyeF);
  const applyInv = (v) => {
    if(!covInv) return Array.from(v);
    const out = new Array(F).fill(0);
    for(let a=0;a<F;a++){ let acc = 0; for(let b=0;b<F;b++) acc += covInv[b][a]*v[b]; out[a] = acc; }
    return out;
  };

  const proj = {}, gnorm = {}, maha = {};
  for(const p of judged){
    const z = zs[p.run], wz = applyInv(z);
    maha[p.run] = Math.sqrt(Math.max(z.reduce((a,v,i)=>a + v*wz[i], 0), 0));
    const g = [], t = [];
    for(let j=0;j<K;j++){
      const gj = KC_FEATURES.map(f => grads[p.run][f.key][j]/scale[f.key]);
      const wg = applyInv(gj);
      const norm = Math.sqrt(Math.max(gj.reduce((a,v,i)=>a + v*wg[i], 0), 0));
      g.push({gj, wg, norm});
      t.push(norm > 1e-6 ? z.reduce((a,v,i)=>a + v*wg[i], 0)/norm : 0);
    }
    gnorm[p.run] = g;
    proj[p.run] = t;
  }

  // Standardise each knob's statistic against its own spread across the runs.
  // Whitening should leave these near unit variance, but measuring rather than
  // assuming costs nothing and covers whatever the shrinkage did not.
  const projScale = [], projMed = [];
  for(let j=0;j<K;j++){
    const col = judged.map(p => proj[p.run][j]);
    projMed.push(kcMedian(col));
    projScale.push(Math.max(1.4826*kcMad(col), 0.7));
  }

  // How unlike the others a run is overall, whitened, for faults with no knob
  // shape at all.
  const mahas = judged.map(p => maha[p.run]);
  const mahaMed = kcMedian(mahas);
  const mahaScale = Math.max(1.4826*kcMad(mahas), 0.5);

  // How big an error would have to be before it could be seen. Worth reporting
  // whatever the findings are: on a saturated amp whose knobs barely move the
  // sound, the honest answer is "more than this tool can see", and that is a
  // far better thing to say than nothing.
  const limits = knobs.map((k,j)=>{
    const norms = judged.map(p => gnorm[p.run][j].norm).filter(v=>v>1e-6);
    const typical = norms.length ? kcMedian(norms) : 0;
    const span = (k.max - k.min) || 1;
    const statistical = typical > 1e-6 ? flagZ*projScale[j]/typical*span : Infinity;
    return {
      knob: k.name,
      units: Math.max(statistical, Math.max(KC_MIN_STEPS*(k.step || 0.5), KC_MIN_TRAVEL*span)),
      limitedByNoise: statistical > Math.max(KC_MIN_STEPS*(k.step || 0.5), KC_MIN_TRAVEL*span),
    };
  });

  // Statistically clear is not the same as worth acting on: this is the second
  // test, and it is a physical one.
  const meaningful = (j, delta) => {
    const k = knobs[j], span = (k.max - k.min) || 1;
    return Math.abs(delta*span) >= Math.max(KC_MIN_STEPS*(k.step || 0.5), KC_MIN_TRAVEL*span);
  };

  const findings = [];
  for(const p of judged){
    const z = zs[p.run];
    const t = proj[p.run].map((v,j)=>(v - projMed[j])/projScale[j]);

    let bestKnob = 0;
    for(let j=1;j<K;j++) if(Math.abs(t[j]) > Math.abs(t[bestKnob])) bestKnob = j;
    const knobStat = t[bestKnob];

    // How far this knob would have had to move, before deciding whether to care.
    const moveFor = (j) => {
      const {wg, norm} = gnorm[p.run][j];
      return norm > 1e-6 ? z.reduce((a,v,i)=>a + v*wg[i], 0)/(norm*norm) : 0;
    };
    const knobShaped = Math.abs(knobStat) > flagZ && meaningful(bestKnob, moveFor(bestKnob));

    let worstF = 0, worstZ = 0;
    z.forEach((v,i)=>{ if(Math.abs(v) > Math.abs(worstZ)){ worstZ = v; worstF = i; } });

    // Unlike every other run, but not in the shape of any one knob: a patch lead
    // half out, a channel that switched off, an amp doing something
    // discontinuous at one end of its travel.
    const justOdd = Math.abs(worstZ) > oddZ
                 || (maha[p.run] - mahaMed)/mahaScale > oddZ;
    if(!knobShaped && !justOdd) continue;

    const overExtended = levs[p.run] > KC_MAX_LEVERAGE_RATIO;
    let suggestion = null;
    if(knobShaped){
      // Least-squares move along this knob's gradient, snapped to a real detent.
      const {gj, wg, norm} = gnorm[p.run][bestKnob];
      const delta = moveFor(bestKnob);
      const k = knobs[bestKnob], span = (k.max - k.min) || 1, step = k.step || 0.5;
      let value = p.values[bestKnob] + delta*span;
      value = Math.max(k.min, Math.min(k.max, Math.round(value/step)*step));
      const applied = (value - p.values[bestKnob])/span;
      if(Math.abs(applied) > 1e-9){
        let left = 0;
        z.forEach((v,i)=>{ const r = v - applied*gj[i]; if(Math.abs(r) > Math.abs(left)) left = r; });
        if(Math.abs(left) <= Math.max(explainZ, Math.abs(worstZ)))
          suggestion = {knob:k.name, knobIndex:bestKnob, value, was:p.values[bestKnob]};
      }
    }

    findings.push({
      run: p.run,
      status: overExtended ? "uncertain" : suggestion ? "explained" : "odd",
      z: knobShaped ? knobStat : worstZ,
      knobStat, worstZ,
      feature: KC_FEATURES[worstF].key,
      featureLabel: KC_FEATURES[worstF].label,
      unit: KC_FEATURES[worstF].unit,
      measured: p.f[KC_FEATURES[worstF].key],
      expected: preds[p.run][KC_FEATURES[worstF].key],
      leverage: levs[p.run],
      distance: maha[p.run],
      suggestion,
      note: overExtended
        ? "These knob settings sit outside the spread of every other run, so the model "
        + "had to extrapolate to predict them. Treat this as a hint, not a verdict."
        : undefined,
    });
  }

  findings.sort((a,b) => Math.abs(b.z||0) - Math.abs(a.z||0));
  return {ready:true, analysed:usable.length, silentCount, findings, scale, shape, limits};
}

/* ------------------------- knob check: the UI side ------------------------- */

// The training region of a NAM v3 take. The blips at 0:09 and the validation
// sections are the same on every run and carry no tone information, so measuring
// them only adds noise shared by everything.
function knobAnalysisWindow(buffer){
  const rate = buffer.sampleRate;
  const data = buffer.getChannelData(0);
  const seconds = data.length/rate;
  if(seconds > 150){                       // the 190 s standard input
    return data.subarray(Math.round(12*rate), Math.min(data.length, Math.round(180*rate)));
  }
  if(seconds > 20){                        // the short 38 s input: skip the one blip
    return data.subarray(Math.round(3*rate));
  }
  return data;
}

// Read a take back from the bridge and measure it. The browser cannot open a
// path on disk, but it can fetch one from the bridge, which is the same origin -
// so the measurement code is the one Lite uses, not a second implementation
// that would drift away from it.
async function measureTakeFromBridge(path){
  const res = await fetch('/api/take?file=' + encodeURIComponent(path));
  if(!res.ok) throw new Error('Could not read the take back from the bridge.');
  const buf = await res.arrayBuffer();
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  const decoded = await audioCtx.decodeAudioData(buf);
  return kcFeatures(knobAnalysisWindow(decoded), decoded.sampleRate);
}

/* ============================= AUDIO / ESR ============================= */
function readFileAsArrayBuffer(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

// Below this the take carries no signal worth rating - our own silent run measured
// about -53 dBFS against -17 dBFS for every other take, so this sits between them.
const SILENCE_DBFS = -45;
const SILENCE_MATCH_DB = 6;   // model may exceed the target by at most this

let audioCtx = null;
async function computeESR(realFile, modelFile){
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  const [bufA, bufB] = await Promise.all([readFileAsArrayBuffer(realFile), readFileAsArrayBuffer(modelFile)]);
  const [decA, decB] = await Promise.all([audioCtx.decodeAudioData(bufA), audioCtx.decodeAudioData(bufB)]);
  const y = decA.getChannelData(0);
  const yhat = decB.getChannelData(0);
  // The real recording lags the model output by this chain's round-trip delay.
  const chain = state.chains[state.validateChain] || state.chains[0];
  const d = Math.round(chain && chain.delay) || 0;
  const offY = d > 0 ? d : 0;
  const offH = d < 0 ? -d : 0;
  const n = Math.min(y.length - offY, yhat.length - offH);
  let errE = 0, sigE = 0, modelE = 0;
  for(let i=0;i<n;i++){
    const diff = y[i+offY]-yhat[i+offH];
    errE += diff*diff;
    sigE += y[i+offY]*y[i+offY];
    modelE += yhat[i+offH]*yhat[i+offH];
  }
  const toDb = e => e > 0 ? 10*Math.log10(e/n) : -Infinity;
  const targetDb = toDb(sigE), modelDb = toDb(modelE);
  // A target with no signal in it cannot yield a meaningful ratio: the model
  // rightly predicts silence and the residual is the amp's own hiss, so ESR lands
  // near 1.0 no matter how good the model is. Score it on level instead.
  const silent = !(sigE > 0) || targetDb < SILENCE_DBFS;
  return {
    silent,
    targetDb,
    modelDb,
    score: silent ? null : errE/sigE,
    // Pass when the model is no louder than the near-silent target. A model that
    // outputs true digital silence (-inf dBFS) is the ideal result, not a failure,
    // so this is one-sided rather than a window.
    levelMatch: silent ? modelDb <= targetDb + SILENCE_MATCH_DB : null,
  };
}

// Progress files written before silence handling stored a bare number.
function asResult(v){
  if(v == null) return null;
  return typeof v === 'number' ? {silent:false, score:v, targetDb:null, modelDb:null, levelMatch:null} : v;
}

function fmtDb(v){
  return (v == null || !isFinite(v)) ? '-inf' : `${v.toFixed(1)} dBFS`;
}

function esrBadge(result){
  const r = asResult(result);
  if(r == null) return '<span class="badge pending">not tested</span>';
  if(r.silent){
    return r.levelMatch
      ? `<span class="badge excellent" title="Target ${fmtDb(r.targetDb)}, model ${fmtDb(r.modelDb)}">Silent · model matches</span>`
      : `<span class="badge failing" title="Target ${fmtDb(r.targetDb)}, model ${fmtDb(r.modelDb)}">Silent · model is not</span>`;
  }
  const score = r.score;
  if(score < 0.005) return `<span class="badge flawless">${score.toFixed(4)} · Flawless</span>`;
  if(score < 0.015) return `<span class="badge excellent">${score.toFixed(4)} · Excellent</span>`;
  if(score < 0.05) return `<span class="badge good">${score.toFixed(4)} · Good</span>`;
  return `<span class="badge failing">${score.toFixed(4)} · Failing</span>`;
}

/* ============================= CAPTURE BRIDGE ============================= */
// NAMTRIX Full talks to a small local program that owns the audio interface.
// Without it the page is exactly Lite: the card never appears.
const bridge = { available:false, error:null, devices:[], checked:false };

async function bridgeApi(path, body){
  const res = await fetch(path, body ? {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  } : undefined);
  let data = null;
  try{ data = await res.json(); }catch(e){ throw new Error(`Bridge returned ${res.status}`); }
  if(!data.ok) throw new Error(data.error || `Bridge returned ${res.status}`);
  return data;
}

async function probeBridge(onWait){
  if(bridge.checked) return bridge;
  bridge.checked = true;
  // Opening PortAudio from a bundled app takes the better part of twenty
  // seconds. Asking once and giving up would turn the app into Lite for the
  // rest of the session over nothing but a slow start, so wait while it says
  // it is still starting.
  const deadline = Date.now() + 45000;
  try{
    for(;;){
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), 3000);
      const res = await fetch('/api/health', {signal: controller.signal});
      clearTimeout(timer);
      const health = await res.json();
      if(health.starting && Date.now() < deadline){
        if(onWait) onWait();
        await new Promise(r=>setTimeout(r, 700));
        continue;
      }
      bridge.available = !!health.ok && !!health.audio;
      bridge.error = health.error || null;
      break;
    }
    if(bridge.available){
      const d = await bridgeApi('/api/devices');
      bridge.devices = d.devices || [];
    }
  }catch(e){
    bridge.available = false;   // page opened without the bridge: stay Lite
  }
  return bridge;
}

// Saved gear lives with the app rather than only in the browser: the page's
// storage is tied to its port, and a second copy of the app lands on another.
const USER_PRESETS_KEY = 'namtrix-user-presets';
let userPresets = [];
function readLocalPresets(){
  try{ const v = JSON.parse(localStorage.getItem(USER_PRESETS_KEY) || '[]'); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
async function loadUserPresets(){
  const merged = new Map(readLocalPresets().map(p => [p.name, p]));
  try{
    const r = await fetch('/api/presets');
    const d = await r.json();
    if(d.ok && Array.isArray(d.presets)) d.presets.forEach(p => merged.set(p.name, p));
  }catch(e){}
  userPresets = [...merged.values()].filter(p => p && p.name && Array.isArray(p.knobs) && p.knobs.length);
}
async function storeUserPresets(){
  try{ localStorage.setItem(USER_PRESETS_KEY, JSON.stringify(userPresets)); }catch(e){}
  try{ await bridgeApi('/api/presets', {presets: userPresets}); }catch(e){}
}
function allGearPresets(){
  return [...GEAR_PRESETS, ...userPresets.map(p => ({...p, group:'My presets'}))];
}
